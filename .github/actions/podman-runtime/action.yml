name: Repair podman's OCI runtime
description: >
  Make rootless podman usable on GitHub-hosted runners by installing a crun new
  enough for the runner's podman. No-op on self-hosted runners.

# Why this exists
# ---------------
# Runner image ubuntu24/20260726.254 bumped podman 4.9.3 -> 5.8.4 but left
# /usr/bin/crun at 1.14.1. Podman 5 writes a newer OCI spec version than crun
# 1.14 recognises, so EVERY container create died with:
#
#   Error: OCI runtime error: crun: unknown version specified
#
# In `podman build` that surfaces even less usefully — the create error is
# swallowed and reported as the Containerfile's RUN step failing, which reads
# like a broken package list rather than a broken runtime.
#
# The hosted pool is MIXED — observed live: one job on podman 4.9.3 with crun
# 1.14.1, another on podman 5.8.4 — so this cannot be conditional on the image
# version. crun 1.28 is verified working against both podman generations, so we
# install it unconditionally and let the probe below be the judge.
#
# Our self-hosted runners (himachal, dilli) have a matched podman/crun pair, so
# this is deliberately hosted-only: it must never rewrite /usr/bin on a box we
# do not own.

inputs:
  crun-version:
    description: crun release to install (containers/crun tag)
    required: false
    default: '1.28'
  require-podman-major:
    description: >
      Triage aid for #71. When set (e.g. '5'), abort in seconds unless the
      runner's podman major version matches. The hosted pool is mixed and the
      arm is not knowable until a job produces logs, so reproducing an
      arm-specific bug otherwise means gambling a full 45-minute E2E per
      attempt. With this set, a wrong arm costs about a minute.
      Leave empty in scheduled runs — it must never gate the nightly.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Select the podman arm (#71 triage; no-op unless requested)
      if: ${{ inputs.require-podman-major != '' && runner.environment == 'github-hosted' }}
      shell: bash
      env:
        REQUIRE_PODMAN_MAJOR: ${{ inputs.require-podman-major }}
      run: |
        set -euo pipefail
        want="$REQUIRE_PODMAN_MAJOR"
        got=$(podman version --format '{{.Client.Version}}' 2>/dev/null | cut -d. -f1)
        echo "podman major: got=${got:-unknown} want=$want"
        if [ "$got" != "$want" ]; then
          echo "::notice::Wrong podman arm (got ${got:-unknown}, wanted $want) — stopping early. Re-dispatch to draw again."
          exit 1
        fi
        echo "Got the requested podman $want arm — continuing."

    - name: Install a podman-compatible crun (hosted runners only)
      if: runner.environment == 'github-hosted'
      shell: bash
      env:
        CRUN_VERSION: ${{ inputs.crun-version }}
      run: |
        set -euo pipefail

        # Report the runtime podman ACTUALLY resolves, by absolute path. A bare
        # `crun --version` lies here: hosted runners carry more than one crun
        # and $PATH prefers /usr/local/bin while podman prefers /usr/bin, so the
        # version you print is not the version that runs your containers.
        echo "::group::Runtime before"
        podman version || true
        podman info --format '{{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Path}} {{.Host.OCIRuntime.Version}}' || true
        type -a crun || true
        for c in /usr/bin/crun /usr/local/bin/crun /usr/sbin/crun; do
          [ -x "$c" ] && printf '%s -> %s\n' "$c" "$("$c" --version | head -1)"
        done
        echo "::endgroup::"

        ver="$CRUN_VERSION"
        url="https://github.com/containers/crun/releases/download/${ver}/crun-${ver}-linux-amd64"
        tmp=$(mktemp -d)
        curl -fsSL --retry 3 --retry-delay 2 -o "$tmp/crun" "$url"
        chmod +x "$tmp/crun"

        # Sanity-check the download before it replaces a working binary: a
        # captive-portal HTML page or a truncated asset would otherwise leave
        # the runner with no usable runtime at all.
        "$tmp/crun" --version

        # Overwrite /usr/bin/crun rather than dropping into /usr/local/bin:
        # podman's default runtime search order puts /usr/bin/crun FIRST, so a
        # /usr/local/bin copy would be found by $PATH but ignored by podman.
        sudo install -m 0755 "$tmp/crun" /usr/bin/crun
        rm -rf "$tmp"

        echo "::group::Runtime after"
        podman info --format '{{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Path}} {{.Host.OCIRuntime.Version}}'
        /usr/bin/crun --version | head -1
        echo "::endgroup::"

    - name: Prove a container can actually be created
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        set -euo pipefail
        # The version strings above do not prove podman and crun agree on the
        # spec — only a real create does. Failing here is far cheaper than
        # failing 6 minutes into an E2E with the error buried in a build log.
        if ! out=$(podman run --rm quay.io/podman/hello 2>&1); then
          echo "::error::rootless podman still cannot create containers after the crun repair"
          printf '%s\n' "$out" >&2
          exit 1
        fi
        echo "rootless podman container create/run: OK"
