name: Real hardware test report
description: Report a wootc install and recovery run on physical Windows hardware.
title: "[hardware] "
labels:
  - field-report
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing wootc on a real machine. This GitHub report is public,
        not anonymous; do not attach account names, serial numbers, passwords,
        recovery keys, private keys or unreviewed logs. See
        [manual testing](https://github.com/tuna-os/wootc/blob/main/docs/manual-testing.md)
        for preparation and log collection. External cohort participation is
        optional: ask the named intake owner to file a consented sanitized
        summary if you do not want to post publicly. Stop on a documentation
        mismatch or recovery concern rather than improvising.

  - type: dropdown
    id: background
    attributes:
      label: Linux background (optional)
      description: Helps evaluate the adoption journey; omit if you prefer. Do not include a private cohort alias or invitation/contact details.
      options:
        - Prefer not to say
        - WSL user
        - New or non-technical Linux user
        - Other Linux experience

  - type: dropdown
    id: assistance
    attributes:
      label: Journey assistance
      description: An assisted run is useful evidence but not an independent cohort completion.
      options:
        - No maintainer help beyond the public instructions
        - Needed maintainer help or undocumented steps
        - Not attempted
    validations:
      required: true

  - type: dropdown
    id: adoption-blocker
    attributes:
      label: Main blocker category
      options:
        - None
        - Trust warning or download
        - Preflight or unsupported environment
        - Storage or partition plan
        - Firmware or boot
        - Network
        - Migration or missing data
        - Documentation or usability
        - Windows recovery or uninstall
        - Other
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Build or tag tested
      placeholder: "Example: v0.2.0-alpha.1 or commit SHA"
    validations:
      required: true

  - type: input
    id: brand
    attributes:
      label: Brand executable
      description: Name the exe used, such as wootc.exe, Bluefin-Installer.exe, or Aurora-Installer.exe.
      placeholder: "Example: Bluefin-Installer.exe"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Vendor, model, CPU architecture, and firmware/BIOS version; omit serial numbers. Say unknown for unavailable details.
      placeholder: "Example: Framework 13 AMD, x86_64, UEFI 3.19"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and edition
      placeholder: "Example: Windows 11 Pro 24H2"
    validations:
      required: true

  - type: dropdown
    id: bitlocker
    attributes:
      label: BitLocker
      options:
        - Off
        - On
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: secure-boot
    attributes:
      label: Secure Boot
      options:
        - Enabled
        - Disabled
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: tpm
    attributes:
      label: TPM 2.0
      options:
        - Present and enabled
        - Present but disabled
        - Not present
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network during deploy
      description: Select Wi-Fi-only when no wired adapter was available.
      options:
        - Wired
        - Wi-Fi only
        - Offline/preloaded
        - Other
    validations:
      required: true

  - type: input
    id: wootc-version
    attributes:
      label: wootc version or commit
      placeholder: "Example: v0.2.0-alpha.1"
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Image reference
      description: Record the selected reference, or say not selected if download, launch or preflight blocked you first.
      placeholder: "Example: ghcr.io/projectbluefin/dakota:stable"
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Furthest journey phase
      options:
        - Download or trust prompt before launch
        - Windows preflight or installer
        - Deployer boot
        - First Linux boot
        - Windows return
        - Uninstall and restore
        - Full journey
    validations:
      required: true

  - type: checkboxes
    id: journey
    attributes:
      label: Journey checkpoints completed
      options:
        - label: Downloaded the exe and ran it, with no files copied to the machine first
        - label: Installer completed and requested a reboot
        - label: Linux deployed and reached a login or desktop
        - label: The welcome opened at first login
        - label: The "Windows drive" bookmark was in the file manager
        - label: Windows files were present in Linux (not just empty folders or cloud placeholders)
        - label: Reboot reached the Windows desktop
        - label: The Manage screen's "Restart into" button reached Linux again
        - label: Uninstall completed and Windows still booted normally
        - label: The verify-uninstall checklist passed and is attached

  - type: dropdown
    id: uninstall-path
    attributes:
      label: Uninstall path tested
      description: "Complete this if you ran the uninstaller. Issue #238 needs each path proven on real hardware."
      options:
        - Not tested
        - Apps (Add/Remove programs)
        - "`wootc.exe uninstall`"
        - Orphaned leftovers (C:\\wootc deleted by hand first)
    validations:
      required: false

  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Green — full journey passed
        - Fixed or retried — eventually passed
        - Red — reproducible failure
        - Inconclusive — needs maintainer review
    validations:
      required: true

  - type: checkboxes
    id: logs
    attributes:
      label: Evidence collected
      description: Check each item attached or pasted below. Remove secrets and recovery keys.
      options:
        - label: Installer log and state (`C:\\wootc\\logs\\` and `C:\\wootc\\state.json`)
        - label: Deployer log (`C:\\wootc\\logs\\deployer.log`)
        - label: Deployer journal snapshot (`C:\\wootc\\logs\\deployer-last-journal.log`)
        - label: Photo or screenshot of what the screen said
        - label: Uninstall proof (`checklist.md` from `tests\\field\\verify-uninstall.ps1 verify`)

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and symptoms
      description: Include timestamps, exact messages, links to attachments, and whether the problem reproduced.
      placeholder: "Describe what happened and list attached files. Never include passwords, recovery keys, or private keys."
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I have a backup and removed passwords, recovery keys, and private keys from attached evidence.
          required: true
