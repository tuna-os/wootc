name: Managed VM QMP component controls

on:
  pull_request:
    paths:
      - 'app/vm_qmp*.go'
      - 'app/vm_display*.go'
      - 'app/vm_process*.go'
      - '.github/workflows/vm-qmp-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Install native component dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86
      - name: Build actual frontend for engine embed
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Require native paused QEMU and source controls
        env:
          WOOTC_REQUIRE_NATIVE_QMP: '1'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/vm-qmp-controls"
          go test -C app . -run 'Test(QMP|VMDisplay|ManagedVMShutdownContract)' \
            -count=1 -race -v | tee "$RUNNER_TEMP/vm-qmp-controls/controls.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: vm-qmp-component-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vm-qmp-controls/controls.log
          if-no-files-found: error
          retention-days: 30
