name: CI

# One workflow for lint, the fast tier and every path-scoped build/test lane
# (formerly ci.yml, ci-tests.yml and lint.yml: three runs and three `changes`
# jobs per PR head). Job names are unchanged, so the required checks keep their
# contexts: `select path-scoped jobs`, `lint (shellcheck + yamllint)` and
# `fast tier (bats + go)`.
#
# The fast tier, lint and `changes` run on every PR and push. Every other job
# runs only when the change touches its inputs. A pull request on a stacked base
# is included: lint and the fast tier have always run on every PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The full set once a day, whatever changed: the backstop for path scoping.
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
concurrency:
  # Keep every main/dispatch verdict, including queued runs (#363).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path scoping: on a pull request or a push to main, each build job below
  # runs only when the change touches its inputs (.github/scripts/ci-scope.sh
  # owns the map). workflow_dispatch and the nightly schedule run every job.
  changes:
    name: select path-scoped jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deployer: ${{ steps.scope.outputs.deployer }}
      app: ${{ steps.scope.outputs.app }}
      recipe: ${{ steps.scope.outputs.recipe }}
      gui: ${{ steps.scope.outputs.gui }}
      classic: ${{ steps.scope.outputs.classic }}
      migration: ${{ steps.scope.outputs.migration }}
      partition: ${{ steps.scope.outputs.partition }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The PR merge commit and its base parent.
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              git diff --name-only HEAD^1 HEAD | tee /dev/stderr | .github/scripts/ci-scope.sh >> "$GITHUB_OUTPUT" ;;
            push)
              # The pushed range only. Every main commit still gets its own
              # run (#363), and a commit that touches a job's inputs runs
              # that job on the combined tree. A range that cannot be read
              # (new branch, force push) runs everything.
              if [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] &&
                 git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
                git diff --name-only "$BEFORE" HEAD | tee /dev/stderr | .github/scripts/ci-scope.sh >> "$GITHUB_OUTPUT"
              else
                .github/scripts/ci-scope.sh --all >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              .github/scripts/ci-scope.sh --all >> "$GITHUB_OUTPUT" ;;
          esac
          cat "$GITHUB_OUTPUT"

  build-deployer:
    needs: changes
    if: needs.changes.outputs.deployer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install podman
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq podman
      - uses: $/.github/actions/podman-runtime

      - name: Build deployer
        run: |
          podman build -f payload/deployer/Containerfile -t wootc-deployer .

      - name: Extract artifacts
        run: |
          podman run --rm --entrypoint /bin/cat localhost/wootc-deployer \
            /out/deployer-initramfs.img > deployer-initramfs.img
          podman run --rm --entrypoint /bin/cat localhost/wootc-deployer \
            /out/deployer-vmlinuz > deployer-vmlinuz
          podman run --rm --entrypoint /bin/cat localhost/wootc-deployer \
            /out/systemd-bootx64.efi > systemd-bootx64.efi
          ls -lah deployer-initramfs.img deployer-vmlinuz systemd-bootx64.efi

      - name: Upload deployer artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wootc-deployer
          path: |
            deployer-initramfs.img
            deployer-vmlinuz
            systemd-bootx64.efi
          retention-days: 7

  build-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: app/go.mod
          # go.sum is in app/; the default (a root go.sum) caches nothing.
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Build frontend
        run: |
          cd app/frontend
          npm install
          npm run build

      - name: Build wootc.exe (windows/amd64)
        run: |
          python3 packaging/build-windows.py --brand wootc --output app/wootc.exe --tags desktop,production
          (cd app && GOOS=windows GOARCH=amd64 go vet ./...)

      # app/ builds against the slurp module (app/go.mod replaces it with
      # ../slurp).
      - name: Test shared slurp module
        run: |
          cd slurp
          go test ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build Linux migration dashboard
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libgtk-3-dev libwebkit2gtk-4.1-dev
          cd app
          # ubuntu-24.04 ships webkit2gtk-4.1 only; wails needs the tag.
          go build -tags desktop,production,webkit2_41 -o wootc-dashboard .
          go vet ./...

      - name: Upload wootc.exe
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wootc-exe
          path: app/wootc.exe
          retention-days: 7

  validate-recipe:
    needs: changes
    if: needs.changes.outputs.recipe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build fisherman
        run: |
          cd fisherman/fisherman
          go build -o /tmp/fisherman ./cmd/fisherman/

      # fisherman validate checks the target the way the install does: the
      # disk must be a whole disk or an attached loop device (lsblk lists it).
      # The deployer installs to an attached loop device, so validate against
      # one; an unattached /dev/loop0 is "not a whole disk".
      - name: Validate default recipe
        run: |
          truncate -s 20G /tmp/wootc-root.disk
          loop=$(sudo losetup --find --show /tmp/wootc-root.disk)
          cat > /tmp/test-recipe.json << EOF
          {
            "disk": "${loop}",
            "filesystem": "xfs",
            "composeFsBackend": false,
            "bootloader": "grub2",
            "image": "ghcr.io/tuna-os/yellowfin:gnome",
            "hostname": "wootc-test",
            "flatpaks": []
          }
          EOF
          /tmp/fisherman validate /tmp/test-recipe.json

  gui-tests:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tests/gui/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/gui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend under test
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Run GUI walkthrough suite
        working-directory: tests/gui
        run: npm test

      - name: Upload GUI screenshots and report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gui-walkthrough-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            docs/screenshots/**/*.png
            tests/gui/playwright-report/
            tests/gui/test-results/
          retention-days: 14

  fast:
    name: fast tier (bats + go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: { submodules: recursive, persist-credentials: false }
      - uses: actions/setup-go@v7.0.0
        # go.sum is in app/; the default (a root go.sum) caches nothing.
        with: {go-version: '1.27', cache-dependency-path: app/go.sum}
      - name: Install native fast-tier fixture dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats rsync qemu-system-common qemu-system-gui binutils
      - name: Fetch coverage comparison base
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$COVERAGE_BASE_SHA"
      - name: Run fast tier and enforce Go coverage
        env:
          WOOTC_COVERAGE_DIR: ${{ runner.temp }}/go-coverage
          WOOTC_COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash tests/run.sh fast
      - name: Upload Go coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: go-coverage
          path: ${{ runner.temp }}/go-coverage
          if-no-files-found: error

  classic-offline:
    name: classic offline package prerequisites
    needs: changes
    if: needs.changes.outputs.classic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require native simulation tools
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          /usr/bin/dpkg-deb --version
          /usr/bin/apt-get --version
      - name: Execute consumer controls and exact source audit
        run: |
          python3 -m unittest discover -s tests/unit -p test_wootc_package_consumer.py
          python3 tests/audit-classic-offline.py .

  integration:
    name: migration integration (container)
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: { submodules: recursive, persist-credentials: false }
      - uses: $/.github/actions/podman-runtime
      - name: Run containerized bridge suite
        run: bash tests/migration/test-bridge.sh

  gui-shots:
    name: GUI screenshots render
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/podman-runtime
      - name: Render the Linux GUIs headlessly
        run: bash tests/gui/capture-linux-guis.sh
      - name: Fail if any screenshot came out blank
        run: |
          for f in docs/screenshots/1[3-6]-*.png; do
            sz=$(stat -c%s "$f")
            echo "$f: $sz bytes"
            [ "$sz" -gt 5000 ] || { echo "::error::$f is blank ($sz bytes)"; exit 1; }
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-gui-screenshots
          path: docs/screenshots/1[3-6]-*.png
          if-no-files-found: error

  partition-policy:
    name: Windows partition policy counterexamples
    needs: changes
    if: needs.changes.outputs.partition == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate PowerShell policy and execute mocked storage controls
        shell: powershell
        run: |
          & ./tests/lint-ps1.ps1 -Files @('app/partition-policy.ps1', 'app/partition-policy.tests.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell policy lint failed' }
          & ./app/partition-policy.tests.ps1

  lint:
    name: lint (shellcheck + yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: app/go.mod

      - name: Check generated step vocabulary
        run: python3 packaging/generate-steps.py --check

      - name: ShellCheck
        run: |
          shellcheck --severity=warning \
            payload/deployer/*.sh \
            platform/dracut/99wootc-boot/*.sh \
            tests/e2e/run-e2e.sh tests/e2e/lib/diagnostics.sh tests/e2e/lib/fixture-bitlocker.sh \
            tests/e2e/steps.sh tests/e2e/e2e-brand.sh \
            tests/e2e/phase-ledger.sh tests/e2e/phase3-snapshot.sh \
            tests/e2e/lib/results.sh \
            tests/e2e/lib/qga-transport.sh tests/e2e/lib/host-runtime.sh tests/e2e/lib/retention.sh tests/e2e/lib/vm-start.sh tests/e2e/lib/gui-session.sh tests/e2e/lib/gui-observations.sh tests/e2e/lib/gui-native.sh tests/e2e/lib/mok.sh tests/e2e/lib/phase2-second-boot.sh \
            tests/e2e/lib/result-runner.sh \
            tests/e2e/lib/snapshot-prime.sh tests/e2e/lib/offline-bundle.sh \
            payload/steps.sh

      - name: ShellCheck migration scripts
        run: |
          shellcheck --severity=error \
            payload/migration/wootc-go-native \
            payload/migration/wootc-wifi-bridge \
            payload/migration/wootc-wsl-bridge \
            payload/migration/wootc-apply-look

      - name: yamllint
        run: |
          pip install --break-system-packages yamllint
          yamllint tests/e2e/compose.yml
          # The release workflow holds the signing and OIDC wiring; a YAML or
          # expression mistake there only shows on a tag push. Relaxed rules:
          # its comments and long `if:` expressions are deliberate.
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' \
            .github/workflows/release.yml

      - name: actionlint (release workflow)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          # The same bar as the ShellCheck step above.
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/release.yml

      - name: Validate autounattend.xml
        run: |
          pip install --break-system-packages xmlschema
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('tests/e2e/autounattend.xml')
          print('XML is well-formed')
          root = tree.getroot()
          assert root.tag == '{urn:schemas-microsoft-com:unattend}unattend'
          print('Root element is unattend')
          "

