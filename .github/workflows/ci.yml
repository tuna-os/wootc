name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The full set once a day, whatever changed: the backstop for path scoping.
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
concurrency:
  # Keep every main/dispatch verdict, including queued runs (#363).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path scoping: on a pull request or a push to main, each build job below
  # runs only when the change touches its inputs (.github/scripts/ci-scope.sh
  # owns the map). workflow_dispatch and the nightly schedule run every job.
  changes:
    name: select path-scoped jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deployer: ${{ steps.scope.outputs.deployer }}
      app: ${{ steps.scope.outputs.app }}
      recipe: ${{ steps.scope.outputs.recipe }}
      gui: ${{ steps.scope.outputs.gui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR merge commit and its base parent.
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              git diff --name-only HEAD^1 HEAD | tee /dev/stderr | .github/scripts/ci-scope.sh >> "$GITHUB_OUTPUT" ;;
            push)
              # The pushed range only. Every main commit still gets its own
              # run (#363), and a commit that touches a job's inputs runs
              # that job on the combined tree. A range that cannot be read
              # (new branch, force push) runs everything.
              if [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] &&
                 git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
                git diff --name-only "$BEFORE" HEAD | tee /dev/stderr | .github/scripts/ci-scope.sh >> "$GITHUB_OUTPUT"
              else
                .github/scripts/ci-scope.sh --all >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              .github/scripts/ci-scope.sh --all >> "$GITHUB_OUTPUT" ;;
          esac
          cat "$GITHUB_OUTPUT"

  build-deployer:
    needs: changes
    if: needs.changes.outputs.deployer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install podman
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq podman
      - uses: ./.github/actions/podman-runtime

      - name: Build deployer
        run: |
          podman build -f payload/deployer/Containerfile -t wootc-deployer .

      - name: Extract artifacts
        run: |
          podman run --rm --entrypoint /bin/cat localhost/wootc-deployer \
            /out/deployer-initramfs.img > deployer-initramfs.img
          podman run --rm --entrypoint /bin/cat localhost/wootc-deployer \
            /out/deployer-vmlinuz > deployer-vmlinuz
          podman run --rm --entrypoint /bin/cat localhost/wootc-deployer \
            /out/systemd-bootx64.efi > systemd-bootx64.efi
          ls -lah deployer-initramfs.img deployer-vmlinuz systemd-bootx64.efi

      - name: Upload deployer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wootc-deployer
          path: |
            deployer-initramfs.img
            deployer-vmlinuz
            systemd-bootx64.efi
          retention-days: 7

  build-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod
          # go.sum is in app/; the default (a root go.sum) caches nothing.
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Build frontend
        run: |
          cd app/frontend
          npm install
          npm run build

      - name: Build wootc.exe (windows/amd64)
        run: |
          python3 packaging/build-windows.py --brand wootc --output app/wootc.exe --tags desktop,production
          (cd app && GOOS=windows GOARCH=amd64 go vet ./...)

      - name: Build Linux migration dashboard
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libgtk-3-dev libwebkit2gtk-4.1-dev
          cd app
          # ubuntu-24.04 ships webkit2gtk-4.1 only; wails needs the tag.
          go build -tags desktop,production,webkit2_41 -o wootc-dashboard .
          go vet ./...

      - name: Upload wootc.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wootc-exe
          path: app/wootc.exe
          retention-days: 7

  validate-recipe:
    needs: changes
    if: needs.changes.outputs.recipe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Build fisherman
        run: |
          cd fisherman/fisherman
          go build -o /tmp/fisherman ./cmd/fisherman/

      - name: Validate default recipe
        run: |
          cat > /tmp/test-recipe.json << 'EOF'
          {
            "disk": "/dev/loop0",
            "filesystem": "xfs",
            "composeFsBackend": false,
            "bootloader": "grub2",
            "image": "ghcr.io/tuna-os/yellowfin:gnome",
            "hostname": "wootc-test",
            "flatpaks": []
          }
          EOF
          /tmp/fisherman validate /tmp/test-recipe.json

  gui-tests:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/gui/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/gui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend under test
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Run GUI walkthrough suite
        working-directory: tests/gui
        run: npm test

      - name: Upload GUI screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gui-walkthrough-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            docs/screenshots/**/*.png
            tests/gui/playwright-report/
            tests/gui/test-results/
          retention-days: 14
