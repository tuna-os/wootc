name: Offline image bundle byte contracts
on:
  pull_request:
    paths:
      - payload/bundle/**
      - payload/deployer/offline-bundle.sh
      - payload/deployer/deploy.sh
      - payload/deployer/module-setup.sh
      - payload/json-check/**
      - tests/offline-image-native.py
      - tests/unit/test_offline_image_bundle.py
      - .github/workflows/offline-image-bundle.yml
permissions:
  contents: read
jobs:
  native-oci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install local import tools; do not acquire an OS or start a VM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo jq
      - name: Validate producer and consumer byte contracts
        run: |
          python3 -m unittest discover -s tests/unit -p test_offline_image_bundle.py
          python3 tests/offline-image-native.py --producer > "$RUNNER_TEMP/offline-oci-native.json"
          python3 tests/offline-image-native.py --docker --producer > "$RUNNER_TEMP/offline-docker-native.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-native-byte-proof
          path: ${{ runner.temp }}/offline-*-native.json
          if-no-files-found: warn
          retention-days: 14
