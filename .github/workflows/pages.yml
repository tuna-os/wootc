name: Pages (walkthrough)

# Publishes the committed `pages/` tree (the E2E walkthrough player + hero
# clip) to GitHub Pages. This runs on the GitHub-hosted ubuntu runner, so it
# does NOT depend on a self-hosted KVM runner — the visual is refreshed by
# committing new assets (see tests/e2e/publish-visual.sh), not by CI recording.

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # e2e-gui.yml (wootc#87) publishes the refreshed timelapse to the
  # pages-assets branch instead of committing it to main, so it dispatches
  # this event to trigger a redeploy -- a push to main touching pages/**
  # no longer happens for that path.
  repository_dispatch:
    types: [e2e-visual-refresh]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch E2E walkthrough media from pages-assets branch
        run: |
          if ! git fetch --depth 1 origin pages-assets; then
            echo "pages-assets branch not published yet — deploying the committed pages/ tree as-is."
          else
            # The whole gallery — per-distribution cuts and the index, not
            # just latest — rides the assets branch.
            git checkout FETCH_HEAD -- pages/e2e
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
