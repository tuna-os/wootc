name: Pages (walkthrough)

# Publishes the committed `pages/` tree (the E2E walkthrough player + hero
# clip) to GitHub Pages. This runs on the GitHub-hosted ubuntu runner, so it
# does NOT depend on a self-hosted KVM runner — the visual is refreshed by
# committing new assets (see tests/e2e/publish-visual.sh), not by CI recording.

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # e2e-gui.yml (wootc#87) publishes the refreshed timelapse to the
  # pages-assets branch instead of committing it to main, so it dispatches
  # this event to trigger a redeploy -- a push to main touching pages/**
  # no longer happens for that path.
  repository_dispatch:
    types: [e2e-visual-refresh]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch latest E2E timelapse from pages-assets branch
        run: |
          if ! git fetch --depth 1 origin pages-assets; then
            echo "pages-assets branch not published yet — deploying the committed pages/ tree as-is."
          else
            git checkout FETCH_HEAD -- pages/e2e/latest
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v5
