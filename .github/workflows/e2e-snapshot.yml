name: E2E Windows base snapshot (prime → GHCR/ORAS)

# Primes a pristine, freshly-installed Windows base image and pushes it to GHCR
# as an ORAS artifact, so the hosted E2E can restore it in ~2 min instead of
# reinstalling Windows (~20-30 min) every run.
#
# What is captured (see run-e2e.sh, WOOTC_E2E_SNAPSHOT_OUT): Windows at the
# desktop, QGA-ready, CLEANLY SHUT DOWN, BEFORE any wootc migration runs. It is
# image-agnostic and wootc-code-agnostic — the target bootc image and deployer
# come from per-run volumes, not the disk — so one image per (win_version,
# bitlocker) axis serves every target-image test. The correctness key is the
# answer-file SHA, stored in the bundle and revalidated on restore.
#
# The package is PRIVATE by policy: it is a Windows OS image. Prefer the eval
# editions (11e/10e) for anything cached long-term.

on:
  workflow_dispatch:
    inputs:
      win_version: { description: 'Dockur version (11, 10, 11e, 10e)', default: '11' }
      bitlocker:   { description: 'BitLocker/FDE axis (on|off)', default: 'off' }
      # The product key SELECTS THE EDITION inside the ISO, and it is folded into
      # the snapshot correctness key (sha256 of the rendered answer file). Priming
      # without it used run-e2e.sh's Enterprise default, which
      #   (a) hung the win10 prime forever on Windows Setup's edition picker
      #       ("No images are available" — the consumer win10 ISO has no
      #       Enterprise image; screenshot, run 30145961492), and
      #   (b) produced a snapshot whose key could never match the Pro-key matrix
      #       cells, so every hosted cell silently did a FULL INSTALL and the
      #       cache was never once used.
      # Must match tests/e2e/matrix.tsv for the cases that consume this snapshot.
      win_edition: { description: 'Edition label (pro|home|enterprise|ltsc|iot)', default: 'pro' }
      win_key:     { description: 'Generic product key selecting that edition', default: 'W269N-WFGWX-YVC9B-4J6C9-T83GX' }
  # MVP: dispatch-only. The weekly base-image refresh schedule is disabled while
  # we iterate — re-add a `schedule:` cron once the E2E is stable.

permissions:
  contents: read
  packages: write

concurrency:
  group: e2e-snapshot-${{ github.event.inputs.win_version || '11' }}-${{ github.event.inputs.win_edition || 'pro' }}-${{ github.event.inputs.bitlocker || 'off' }}
  cancel-in-progress: false

jobs:
  prime:
    runs-on: ubuntu-latest
    # 120 could not contain a 90-minute QGA budget plus deps, qcow2 compaction
    # and the ORAS push. This job runs rarely (once per version/BitLocker axis)
    # and every matrix cell depends on its output, so give it real headroom.
    timeout-minutes: 240
    env:
      WIN_VERSION: ${{ github.event.inputs.win_version || '11' }}
      BITLOCKER:   ${{ github.event.inputs.bitlocker   || 'off' }}
      WIN_EDITION: ${{ github.event.inputs.win_edition || 'pro' }}
      WIN_KEY:     ${{ github.event.inputs.win_key || 'W269N-WFGWX-YVC9B-4J6C9-T83GX' }}
      # ghcr.io/<owner>/wootc-winbase:<win_version>-<edition>-bl-<axis>
      PKG: ghcr.io/${{ github.repository_owner }}/wootc-winbase
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }

      - name: Confirm KVM + install qemu-utils (qemu-img)
        run: |
          ls -l /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-kvm qemu-utils podman podman-compose python3-pip
          pip install --quiet podman-compose || true
          sudo usermod -aG kvm "$USER" || true
          sudo chmod 0666 /dev/kvm

      - name: Install ORAS
        run: |
          VERSION=1.2.0
          curl -fsSL -o oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          tar -xzf oras.tar.gz oras
          sudo install -m 0755 oras /usr/local/bin/oras
          oras version

      - name: Reclaim disk (hosted runners ship ~30 GB of toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/lib/node_modules /usr/share/swift || true
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          df -h / /mnt

      - name: Put VM storage on /mnt (the only volume with room)
        run: |
          sudo mkdir -p /mnt/wootc-storage /mnt/wootc-iso /mnt/wootc-snapshot
          sudo chown -R "$USER" /mnt/wootc-storage /mnt/wootc-iso /mnt/wootc-snapshot
          rm -rf tests/e2e/storage tests/e2e/iso-cache
          ln -s /mnt/wootc-storage tests/e2e/storage
          ln -s /mnt/wootc-iso     tests/e2e/iso-cache

      - name: Prime the pristine Windows base image
        env:
          WOOTC_E2E_RAM_SIZE: 6G
          WOOTC_E2E_DEPLOY_TIMEOUT: '3000'      # 50 min: install-only, no deploy
          # Priming is exactly the slow full Windows install this snapshot exists
          # to skip, so it needs the MOST generous QGA budget of any job — the
          # win10 prime died at the 2700s default ("QGA did not become available
          # within 45 minutes", run 30140823622), which is circular: the cure
          # failed from the disease. One-time cost, then every matrix cell
          # restores in a couple of minutes.
          # BitLocker primes need MORE: encryption runs during setup, so the
          # install is materially slower. The 11-pro-bl-on prime was still at
          # "Installing Windows 11 — 56% complete" (screenshot, run 30153784274)
          # when the 90-min budget expired — real progress, not a stuck prompt.
          # 150 min still fits inside timeout-minutes: 240.
          WOOTC_E2E_WINDOWS_QGA_TIMEOUT: ${{ github.event.inputs.bitlocker == 'on' && '9000' || '5400' }}
          WOOTC_E2E_WIN_VERSION: ${{ env.WIN_VERSION }}
          WOOTC_E2E_WIN_EDITION: ${{ env.WIN_EDITION }}
          WOOTC_E2E_WIN_KEY:     ${{ env.WIN_KEY }}
          WOOTC_E2E_BITLOCKER:  ${{ env.BITLOCKER }}
          WOOTC_E2E_SNAPSHOT_OUT: /mnt/wootc-snapshot
        run: |
          cd tests/e2e
          # The image ref is irrelevant to priming (nothing is deployed), but
          # run-e2e.sh needs a positional; pass the default target.
          bash run-e2e.sh ghcr.io/tuna-os/yellowfin:gnome

      # A failed prime left NO evidence at all, so "QGA never came up" could not
      # be told apart from "Windows setup is stuck on a screen". The win10 prime
      # (run 30142722155) waited the full 90 min while QEMU burned only ~6% CPU
      # — an IDLE guest, i.e. parked on a prompt — and the screenshot that would
      # name that prompt was never uploaded.
      - name: Upload prime diagnostics (screenshot + serial)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: winbase-prime-${{ env.WIN_VERSION }}-${{ env.WIN_EDITION }}-bl-${{ env.BITLOCKER }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            tests/e2e/storage/artifacts/**
            tests/e2e/storage/qemu.pty

      - name: Push base image to GHCR via ORAS
        run: |
          set -euo pipefail
          TAG="${WIN_VERSION}-${WIN_EDITION}-bl-${BITLOCKER}"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd /mnt/wootc-snapshot
          ls -lh
          # Compressed qcow2 + dockur markers + the correctness key. The custom
          # media types keep this out of any "container image" tooling paths.
          oras push "${PKG}:${TAG}" \
            --artifact-type application/vnd.wootc.winbase.v1 \
            data.qcow2:application/vnd.wootc.winbase.qcow2 \
            snapshot.key:text/plain \
            .wootc-autounattend.sha256:text/plain \
            $(ls windows.* 2>/dev/null | sed 's,$,:application/octet-stream,')
          echo "Pushed ${PKG}:${TAG}"
