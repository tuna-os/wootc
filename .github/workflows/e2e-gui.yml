name: E2E GUI-driven (publish timelapse)

# The GUI-driven three-phase run: Phase 1 armed by the REAL wootc.exe over
# drive mode, then deploy → Phase 2 → Phase 3. On a GREEN run this publishes
# the walkthrough timelapse to the README/Pages hero — so the timelapse shown
# there is always a GUI-driven pass, never a headless or red run.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'bootc image to install'
        type: string
        default: 'ghcr.io/projectbluefin/bluefin:lts'
      require_podman_major:
        description: '#71 triage: only run if the runner drew this podman major (e.g. 5). Empty = any.'
        type: string
        default: ''
      phase3:
        description: 'Graduate to a native disk (Phase 3). Off = the run ends back in Windows, so the timelapse closes on the untouched-Windows demo — the right cut for showcase videos.'
        type: boolean
        default: true
  schedule:
    # Nightly, offset from the headless canary so they do not contend for
    # the hosted runner pool.
    - cron: '0 7 * * *'

permissions:
  contents: write        # commit the refreshed timelapse to pages/
  packages: read

concurrency:
  group: e2e-gui-publish
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/e2e-hosted.yml
    with:
      image: ${{ inputs.image || 'ghcr.io/projectbluefin/bluefin:lts' }}
      gui_install: true
      # Scheduled nightlies always graduate; a dispatch may turn Phase 3 off
      # for showcase cuts (the run then ends back in Windows on camera).
      # Comparing a boolean input to '' is a coercion trap (false == '' is
      # TRUE in GH expressions), so branch on the event instead.
      phase3: ${{ github.event_name == 'schedule' && true || inputs.phase3 }}
      use_base_image: true
      require_podman_major: ${{ inputs.require_podman_major || '' }}
    # No secrets: block — e2e-hosted.yml only uses secrets.GITHUB_TOKEN, which
    # every job gets automatically. `secrets: inherit` exposed every repo
    # secret to this job for no reason; the other three callers of this
    # reusable workflow (e2e-matrix.yml, e2e-nightly.yml, release.yml) already
    # call it with no secrets: block at all. See #153.

  publish:
    needs: run
    # Belt: only a passing run reaches here. Braces: the .passed gate below
    # is the real proof, so a run that "succeeded" without the marker still
    # cannot publish.
    if: ${{ needs.run.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          # Must track e2e-hosted.yml's per-case upload name. This job passes no
          # case_name, so the reusable workflow uploads "e2e-run-<run_id>";
          # asking for the stale "e2e-nightly-" name failed a GREEN run's publish.
          name: e2e-run-${{ github.run_id }}
          path: /tmp/evidence

      - name: Publish the GUI-driven timelapse (green runs only)
        run: |
          set -euo pipefail
          # run-e2e.sh writes .passed into the video dir ONLY on ALL TESTS
          # PASSED. No marker → nothing to publish (fail-safe, not fail-loud).
          vd=$(find /tmp/evidence -type f -name .passed -printf '%h\n' 2>/dev/null | head -1)
          if [ -z "$vd" ] || [ ! -f "$vd/preview.webp" ]; then
            # We only get here when the e2e job SUCCEEDED, i.e. run-e2e.sh printed
            # ALL TESTS PASSED and therefore stamped .passed. A missing marker or
            # preview is a broken evidence path, not a benign "nothing to do" —
            # exiting 0 here would report green while the hero silently went stale.
            echo "::error::e2e passed but no .passed + preview.webp found under /tmp/evidence — evidence path is broken." >&2
            find /tmp/evidence -maxdepth 3 -type d >&2 || true
            exit 1
          fi
          echo "Publishing GUI-driven timelapse from $vd"
          mkdir -p pages/e2e/latest
          cp "$vd/preview.webp" pages/e2e/latest/preview.webp
          [ -f "$vd/e2e.webm" ] && cp "$vd/e2e.webm" pages/e2e/latest/e2e.webm || echo "(poster only; no e2e.webm)"
          cp "$vd/.passed" pages/e2e/latest/.passed 2>/dev/null || true

          if git diff --quiet -- pages/e2e/latest; then
            echo "Timelapse unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # wootc#87: never append binary media to main's history (each green
          # run previously added ~4.4 MB -- e2e.webm + preview.webp -- that no
          # future commit could reclaim: 26 MB across 7 runs before this fix).
          # Publish the timelapse to a dedicated pages-assets branch instead;
          # pages.yml fetches the latest media from there at deploy time. The
          # branch is force-pushed as a fresh orphan root every run, so it
          # never accumulates history either -- only the latest media exists
          # on it at any time. README.md's hero now points at the live Pages
          # URL (not a relative git path), so it keeps rendering with no
          # commit to main required.
          git checkout --orphan pages-assets
          git rm -rf --cached . >/dev/null
          git add pages/e2e/latest
          git commit -m "e2e visual: refresh GUI-driven walkthrough media (${{ github.run_id }})"
          git push -f origin HEAD:pages-assets

          # Ask pages.yml to redeploy with the refreshed media -- it only
          # triggers on push to main touching pages/** or workflow_dispatch
          # otherwise, neither of which happens here anymore.
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"e2e-visual-refresh"}'
