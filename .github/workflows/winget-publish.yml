name: winget publish

# Submits (or updates) TunaOS.wootc in microsoft/winget-pkgs whenever a FULL
# release is published — pre-releases (the auto-v* nightly channel) are
# skipped, because winget users should land on E2E-gated, human-blessed
# builds only. See packaging/winget/README.md for the one-time setup
# (WINGET_TOKEN secret) and why branded installers are not auto-submitted.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)submit, e.g. v0.1.0'
        type: string
        required: true

permissions:
  contents: read

jobs:
  render:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: windows-latest
    outputs:
      manifest_dir: ${{ steps.manifests.outputs.manifest_dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Render manifests from the release
        id: manifests
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '\Av?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?\z') {
            throw 'Expected a release tag such as v1.2.3 or v1.2.3-rc.1'
          }
          $version = $tag -replace '^v',''
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/wootc.exe"
          Write-Host "tag=$tag version=$version"
          Write-Host "url=$url"
          # Hash the ACTUAL published bytes — never trust a locally rebuilt exe.
          Invoke-WebRequest -Uri $url -OutFile wootc.exe
          $sha = (Get-FileHash wootc.exe -Algorithm SHA256).Hash
          Write-Host "sha256=$sha"
          $out = "rendered/manifests/t/TunaOS/wootc/$version"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem packaging/winget/*.yaml.in | ForEach-Object {
            $dest = Join-Path $out ($_.Name -replace '\.in$','')
            (Get-Content $_ -Raw) `
              -replace '\{\{VERSION\}\}', $version `
              -replace '\{\{TAG\}\}', $tag `
              -replace '\{\{URL\}\}', $url `
              -replace '\{\{SHA256\}\}', $sha `
              | Set-Content -NoNewline $dest
            Write-Host "rendered $dest"
          }
          Get-ChildItem $out | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName }
          echo "manifest_dir=$out" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: rendered/
          if-no-files-found: error
          retention-days: 7

  submit:
    needs: render
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: winget-manifests
          path: rendered/

      # Fetch and verify the pinned tool before exposing the submission token.
      - name: Prepare verified wingetcreate
        shell: pwsh
        run: |
          . ./packaging/winget/verified-tool.ps1
          $tool = Install-VerifiedWingetCreate -Destination $env:RUNNER_TEMP
          "WINGETCREATE_EXE=$tool" >> $env:GITHUB_ENV

      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          MANIFEST_DIR: ${{ needs.render.outputs.manifest_dir }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Host "::notice::WINGET_TOKEN is not set. Download the rendered manifests from this run's artifact."
            exit 0
          }
          & $env:WINGETCREATE_EXE submit --prtitle "TunaOS.wootc: update" $env:MANIFEST_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
