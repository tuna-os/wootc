name: Lint

# One job preserves both former lint scopes, including PRs with a stacked base.
# Keep the existing required status name so branch protection can still gate it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (shellcheck + yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod

      - name: Check generated step vocabulary
        run: python3 packaging/generate-steps.py --check

      - name: ShellCheck
        run: |
          shellcheck --severity=warning \
            payload/deployer/*.sh \
            platform/dracut/99wootc-boot/*.sh \
            tests/e2e/run-e2e.sh tests/e2e/lib/diagnostics.sh \
            tests/e2e/steps.sh tests/e2e/e2e-brand.sh \
            tests/e2e/phase-ledger.sh tests/e2e/phase3-snapshot.sh \
            tests/e2e/lib/results.sh \
            tests/e2e/lib/qga-transport.sh tests/e2e/lib/host-runtime.sh tests/e2e/lib/retention.sh tests/e2e/lib/vm-start.sh tests/e2e/lib/gui-session.sh tests/e2e/lib/gui-observations.sh tests/e2e/lib/gui-native.sh tests/e2e/lib/mok.sh \
            tests/e2e/lib/result-runner.sh \
            tests/e2e/lib/snapshot-prime.sh tests/e2e/lib/offline-bundle.sh \
            payload/steps.sh

      - name: ShellCheck migration scripts
        run: |
          shellcheck --severity=error \
            payload/migration/wootc-go-native \
            payload/migration/wootc-wifi-bridge \
            payload/migration/wootc-wsl-bridge \
            payload/migration/wootc-apply-look

      - name: yamllint
        run: |
          pip install --break-system-packages yamllint
          yamllint tests/e2e/compose.yml
          # The release workflow holds the signing and OIDC wiring; a YAML or
          # expression mistake there only shows on a tag push. Relaxed rules:
          # its comments and long `if:` expressions are deliberate.
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' \
            .github/workflows/release.yml

      - name: actionlint (release workflow)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          # The same bar as the ShellCheck step above.
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/release.yml

      - name: Validate autounattend.xml
        run: |
          pip install --break-system-packages xmlschema
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('tests/e2e/autounattend.xml')
          print('XML is well-formed')
          root = tree.getroot()
          assert root.tag == '{urn:schemas-microsoft-com:unattend}unattend'
          print('Root element is unattend')
          "

