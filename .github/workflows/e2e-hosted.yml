name: E2E (hosted KVM, reusable)

# The single hosted-runner E2E definition, called by BOTH the nightly canary and
# the release gate — so a release is gated on exactly the run that has been
# proving itself every night, not a second, drifting copy.

on:
  workflow_call:
    inputs:
      image:       { type: string, default: 'ghcr.io/tuna-os/yellowfin:gnome' }
      win_version: { type: string, default: '11' }
      # Windows edition axis (matrix.tsv): the generic key selects the edition
      # from the ISO; empty keeps run-e2e.sh's defaults (Pro).
      win_edition: { type: string, default: '' }
      win_key:     { type: string, default: '' }
      bitlocker:   { type: string, default: 'off' }
      # Require the ordinary-user GNOME editor save/reopen/restart proof for
      # the real BitLocker fixture. This is deliberately opt-in because it is
      # a focused acceptance lane, not a replacement for the broad matrix.
      gui_documents: { type: boolean, default: false }
      # Names this cell's evidence artifact so parallel cells do not collide.
      case_name:   { type: string, default: '' }
      # #71 triage only: stop in seconds unless the runner drew this podman
      # major. Empty (the default) means take whatever arm we land on, so the
      # nightly is never gated by it.
      require_podman_major: { type: string, default: '' }
      # Force a full Windows install (skip the base-image restore). The restore
      # path (--skip-install on a snapshot) currently fails at the deployer-boot
      # handoff, so a full install is the reliable path to Phase 2 — and the only
      # way to diagnose the Phase-2 attach while the restore path is unfixed.
      use_base_image: { type: boolean, default: true }
      # Rung 3: after Phase 2 boots, graduate the migration onto a BLANK second
      # disk (wootc-go-native migrate --to-disk) — the full 1→2→3 chain. Gives
      # the guest a spare 40G drive (WOOTC_E2E_DISK2_SIZE) and passes --phase3.
      # Windows + root.disk stay untouched, so the run remains reversible.
      phase3: { type: boolean, default: false }
      # Offline axis (#217): the guest VM gets no network device, and the
      # deployer must install from an OCI bundle staged over QGA. Passes
      # --offline. Script path only (run-e2e.sh refuses it with gui_install).
      offline: { type: boolean, default: false }
      # Force the Phase-2 bootloader (grub2|systemd). Empty = run-e2e.sh's
      # per-image heuristic (EL→grub2, else→systemd). Ostree images (e.g.
      # bluefin) want grub2 (the proven attach path); composefs wants systemd.
      bootloader: { type: string, default: '' }
      # Force the root filesystem (xfs|ext4|btrfs) via wootc.filesystem=.
      # Empty/auto = the deployer's own default (xfs unsealed, ext4 sealed).
      # The btrfs matrix cell uses this to prove #35.
      filesystem: { type: string, default: '' }
      # Arm Phase 1 through the REAL wootc.exe GUI (drive mode) instead of the
      # OEM setup-wootc.ps1 script. Needs no host GUI — the app is staged +
      # driven over QGA via a directive file (CDP is impossible in stock
      # wails). Works on either the base-image restore or a full install
      # (both boot to the autologged desktop; drive mode never touches
      # C:\OEM). The walkthrough timelapse from a GUI-driven run is the one
      # the README publishes.
      gui_install: { type: boolean, default: false }
      # Which GUI gui_install drives: 'wails' (the shipped installer) or
      # 'native' (the WinUI shell, #344). Native publishes the shell on a
      # Windows runner (the XAML compiler needs Windows), then the E2E job
      # builds the engine beside it with this run's manifest-signing key and
      # installs the pair as a protected package in the guest.
      gui_frontend: { type: string, default: 'wails' }
      # Native only: start the shell unelevated (a /RL LIMITED task) so the
      # engine's own runas elevation is what the run proves. false restores
      # the elevated-shell launch.
      native_unelevated: { type: boolean, default: true }
      # After a non-phase3 run returns to Windows: run the documented
      # uninstaller and hold it to its claims (boot entries gone, ESP clean,
      # root.disk preserved, Windows reboots cleanly). Adds a Windows reboot.
      uninstall_check: { type: boolean, default: false }
      # Fault-injection axis (#288): injects simulated failure or cancellation
      # at an install boundary: "root-disk", "image-pull", "efi-staging", "bcd-arming", "pre-reboot", "deploy-failure".
      fault_inject: { type: string, default: '' }
      # Firmware db axis (#322): which Microsoft third-party UEFI CA the VM's
      # Secure Boot db holds — 2011, 2023, both, or none. Empty keeps
      # Dockur's stock vars. "none" needs gui_install: its pass is a refusal.
      firmware_db: { type: string, default: '' }
    outputs:
      # Non-empty ONLY when run-e2e.sh classified its own failure as a known
      # infrastructure flake (qga-channel-lost, serial-feed-lost). Callers may
      # use it to re-dispatch the same run once; an unclassified failure must
      # never be retried automatically — the day this was added, two real bugs
      # wore flake-shaped symptoms until a human read the serial.
      flake_verdict:
        value: ${{ jobs.e2e.outputs.flake_verdict }}

permissions:
  contents: read
  packages: read                 # pull the pre-installed Windows base image
  # List this run's artifacts: the native-shell and e2e jobs hand the native
  # package to each other while both run (.github/scripts/wait-run-artifact.sh).
  actions: read

jobs:
  # The native shell for gui_frontend=native: the shipped preview build
  # (never the -p:NativeGallery=true screen gallery, which replays recorded
  # fixtures and starts no engine). Its build and brand identity are compiled
  # in here; the engine the e2e job builds must carry the same two.
  #
  # This job and e2e run side by side and hand files to each other through
  # this run's artifacts, because the handoff goes both ways: the shell goes
  # to e2e, which builds the engine with the run's manifest-signing key (its
  # seed never leaves that job) and writes native-package.json; the engine and
  # manifest come back here, where the real Inno preview installer is
  # compiled for the brand, as winui-preview.yml compiles it; the installer
  # goes back to e2e, which installs it in the guest. Each side uploads a
  # status-only artifact under the name the other waits for if it fails
  # first, so neither waits out its budget for a job that has stopped.
  native-shell:
    if: ${{ inputs.gui_install && inputs.gui_frontend == 'native' }}
    runs-on: windows-latest
    # Mostly waiting: the e2e job may sit in the runner queue long after this
    # job starts, and its engine comes only after its own setup. A failed e2e
    # job uploads a failure marker and a cancelled run cancels both jobs, so
    # the wide budget is only ever spent on a queue.
    timeout-minutes: 280
    env:
      NATIVE_SHELL_ARTIFACT: e2e-native-shell-${{ inputs.case_name || 'run' }}-${{ github.run_id }}
      NATIVE_ENGINE_ARTIFACT: e2e-native-engine-${{ inputs.case_name || 'run' }}-${{ github.run_id }}
      NATIVE_INSTALLER_ARTIFACT: e2e-native-installer-${{ inputs.case_name || 'run' }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: brand
        shell: bash
        env:
          WOOTC_TARGET_IMAGE: ${{ inputs.image }}
        run: echo "brand=$(bash tests/e2e/e2e-brand.sh "$WOOTC_TARGET_IMAGE")" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: shell/global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('shell/global.json', 'shell/Directory.Build.props', 'shell/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publish the native shell (preview build, never the gallery)
        working-directory: shell
        env:
          BRAND: ${{ steps.brand.outputs.brand }}
        run: dotnet publish Wootc.Shell/Wootc.Shell.csproj --configuration Release --runtime win-x64 -p:Platform=x64 -p:NativeBuildId=${{ github.sha }} -p:NativeBrandId=${{ env.BRAND }} --output ../out/native-shell
      - name: Refuse a gallery build
        shell: bash
        run: |
          set -euo pipefail
          if [ -e out/native-shell/Fixtures ] || compgen -G 'out/native-shell/Wootc.Shell.Gallery.*' >/dev/null; then
            echo "::error::the published shell is the screen gallery build; E2E never drives it"; exit 1
          fi
          ls -l out/native-shell/Wootc.Shell.exe out/native-shell/Branding/brand.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.NATIVE_SHELL_ARTIFACT }}
          path: out/native-shell/
          if-no-files-found: error
          retention-days: 3
          # The manifest is written over the downloaded copy and checked here
          # against this directory: both must hold the same set of files.
          include-hidden-files: true
      - name: Wait for the e2e job's engine and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-run-artifact.sh 14400 "$NATIVE_ENGINE_ARTIFACT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.NATIVE_ENGINE_ARTIFACT }}
          path: out/native-engine
      # The manifest was written on Linux over the shell this job published;
      # checking it here proves both jobs hold the same bytes before the
      # installer is compiled around them.
      - name: Complete the package with the e2e job's engine and manifest
        shell: bash
        env:
          BRAND: ${{ steps.brand.outputs.brand }}
        run: |
          set -euo pipefail
          status=$(tr -d '\r\n' < out/native-engine/status.txt)
          [ "$status" = ok ] || { echo "::error::the e2e job did not build the native engine (status: $status)"; exit 1; }
          cp out/native-engine/wootc-engine.exe out/native-engine/native-package.json out/native-shell/
          identity=$(python tests/e2e/native-package.py check out/native-shell)
          echo "$identity"
          [ "${identity%% files=*}" = "buildId=${{ github.sha }} brandId=$BRAND" ] || { echo "::error::the package identity is not this run's build and brand"; exit 1; }
      - name: Compile the preview installer for the brand (pinned Inno Setup)
        shell: pwsh
        env:
          BRAND: ${{ steps.brand.outputs.brand }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/native-installer | Out-Null
          $scratch = Join-Path $env:RUNNER_TEMP 'wootc-native-inno'
          try {
            $compiled = ./shell/packaging/compile-preview.ps1 -BrandId $env:BRAND -BuildId '${{ github.sha }}' -PackageDirectory out/native-shell -OutputDirectory out/native-installer -ScratchDirectory $scratch
            Get-Item -LiteralPath $compiled.Installer | Format-List FullName, Length
            Set-Content -LiteralPath out/native-installer/status.txt -Value 'inno' -Encoding ascii
          } catch {
            if ($_.Exception.Message -notlike 'INNO-UNAVAILABLE:*') { throw }
            # The only case the e2e job may fall back to a robocopy, and it
            # says so in the run and in its native-shell assertion.
            Write-Output "::warning::$($_.Exception.Message); the e2e job will copy the package with robocopy instead of installing it"
            Get-ChildItem out/native-installer -Filter *.exe | Remove-Item -Force
            Set-Content -LiteralPath out/native-installer/status.txt -Value 'inno-unavailable' -Encoding ascii
          }
      - id: installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.NATIVE_INSTALLER_ARTIFACT }}
          path: out/native-installer/
          if-no-files-found: error
          retention-days: 3
      - name: Tell the e2e job this job failed
        if: ${{ failure() && steps.installer.outcome != 'success' }}
        shell: bash
        run: mkdir -p out/native-failed && echo failed > out/native-failed/status.txt
      - if: ${{ failure() && steps.installer.outcome != 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.NATIVE_INSTALLER_ARTIFACT }}
          path: out/native-failed/
          retention-days: 3

  e2e:
    # No needs: native-shell. A native cell runs both jobs side by side and
    # hands the package over through artifacts (see native-shell above).
    runs-on: ubuntu-latest
    timeout-minutes: 330          # under the 6 h hard cap, with headroom
    env:
      NATIVE: ${{ inputs.gui_install && inputs.gui_frontend == 'native' }}
      NATIVE_SHELL_ARTIFACT: e2e-native-shell-${{ inputs.case_name || 'run' }}-${{ github.run_id }}
      NATIVE_ENGINE_ARTIFACT: e2e-native-engine-${{ inputs.case_name || 'run' }}-${{ github.run_id }}
      NATIVE_INSTALLER_ARTIFACT: e2e-native-installer-${{ inputs.case_name || 'run' }}-${{ github.run_id }}
    outputs:
      flake_verdict: ${{ steps.flake.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { submodules: recursive }

      - name: Confirm KVM is available
        run: |
          ls -l /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
          sudo apt-get update -qq
          # wimlib-imagex + 7z let the harness READ the installer ISO's image
          # names and fill /IMAGE/NAME correctly instead of guessing (#58).
          # Both are small; without them the harness simply sends no name, which
          # is the pre-#58 behaviour.
          sudo apt-get install -y -qq qemu-kvm podman podman-compose python3-pip wimtools p7zip-full
          pip install --quiet podman-compose || true
          # let the unprivileged runner user open /dev/kvm
          sudo usermod -aG kvm "$USER" || true
          sudo chmod 0666 /dev/kvm
          kvm-ok || true

      # virt-fw-vars writes the firmware db cell into the OVMF vars (#322).
      # Its own venv, linked onto PATH as a command: the harness's python3
      # stays the system one, and the step costs nothing on other cells.
      - name: Install virt-fw-vars for the firmware db axis
        if: ${{ inputs.firmware_db != '' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/virt-firmware"
          "$RUNNER_TEMP/virt-firmware/bin/pip" install --quiet 'virt-firmware==26.9'
          sudo ln -sf "$RUNNER_TEMP/virt-firmware/bin/virt-fw-vars" /usr/local/bin/virt-fw-vars
          virt-fw-vars --help >/dev/null

      - name: Reclaim disk (hosted runners ship ~30 GB of toolchains)
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/lib/node_modules /usr/share/swift || true
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          echo "--- after cleanup ---"; df -h / /mnt

      - name: Put VM storage on /mnt (the only volume with room)
        run: |
          sudo mkdir -p /mnt/wootc-storage /mnt/wootc-iso
          sudo chown -R "$USER" /mnt/wootc-storage /mnt/wootc-iso
          rm -rf tests/e2e/storage tests/e2e/iso-cache
          ln -s /mnt/wootc-storage tests/e2e/storage
          ln -s /mnt/wootc-iso     tests/e2e/iso-cache
          df -h /mnt

      # Ahead of every podman call: the runner's podman is newer than its crun,
      # which makes container CREATE fail (see the action for the full story).
      - uses: ./.github/actions/podman-runtime
        with:
          require-podman-major: ${{ inputs.require_podman_major }}

      # Every cell needs the real CLI for lifecycle and recovery assertions. Ubuntu runners
      # ship Go + Node; the wails frontend is a plain vite build, and the
      # binary cross-compiles GOOS=windows. Drive mode needs no CDP/webview
      # loader tag, so this is a stock production build.
      - name: Set up Node for lifecycle CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Disk reclaim removes the runner's preinstalled global Node modules.
          # GUI runs build the real Wails frontend, so explicitly restore a
          # supported Node toolchain before invoking npm.
          node-version: '24'

      - name: Set up Go for lifecycle CLI
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # The app module declares Go 1.25; disk reclaim removes the hosted
          # toolcache, so a GUI run must provision it explicitly.
          go-version: '1.27.x'
          # go.sum is in app/; the default (a root go.sum) caches nothing.
          cache-dependency-path: app/go.sum

      - name: Build wootc.exe for lifecycle and GUI checks
        env:
          WOOTC_TARGET_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq librsvg2-bin
          ( cd app/frontend && npm ci --silent && npm run build )
          # Wear the brand that matches the image under test (see the
          # script). Preload is separately forced off in the guest via
          # WOOTC_PRELOAD=0 until the offline axis (#217) is green.
          BRAND_ID=$(bash tests/e2e/e2e-brand.sh "$WOOTC_TARGET_IMAGE")
          echo "WOOTC_E2E_BRAND=$BRAND_ID" >> "$GITHUB_ENV"
          # Use the release build path so the walkthrough proves the same
          # icon, Windows metadata, elevation manifest, and runtime brand.
          # Omit --version: E2E uses the locally staged boot artifacts.
          key_dir=$(mktemp -d "$RUNNER_TEMP/wootc-e2e-signing.XXXXXX")
          (cd app && go run ./tools/signmanifest generate "$key_dir/seed" "$key_dir/public.hex")
          echo "WOOTC_E2E_MANIFEST_KEY=$key_dir/seed" >> "$GITHUB_ENV"
          python3 packaging/build-windows.py --brand "$BRAND_ID" \
              --manifest-public-key "$key_dir/public.hex" \
              --output tests/e2e/wootc-files/wootc.exe
          ls -lh tests/e2e/wootc-files/wootc.exe
          echo "WOOTC_E2E_MANIFEST_PUBLIC=$key_dir/public.hex" >> "$GITHUB_ENV"

      - name: Wait for the native shell
        if: ${{ env.NATIVE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The installer artifact appears first only as the native-shell
          # job's failure marker: it failed before publishing the shell.
          got=$(bash .github/scripts/wait-run-artifact.sh 2400 "$NATIVE_SHELL_ARTIFACT" "$NATIVE_INSTALLER_ARTIFACT")
          [ "$got" = "$NATIVE_SHELL_ARTIFACT" ] || { echo "::error::the native-shell job failed before it published the shell"; exit 1; }

      - name: Download the native shell
        if: ${{ env.NATIVE == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.NATIVE_SHELL_ARTIFACT }}
          path: tests/e2e/wootc-files/native-shell

      # The engine is the same Go program as wootc.exe, built the way
      # winui-preview.yml builds the preview engine, plus this run's
      # manifest-signing public key (the staged SHA256SUMS.sig is signed with
      # its seed, which never leaves this job). Its build and brand identity
      # must equal the shell's or both peers refuse the session.
      - name: Assemble the native package (shell + engine + manifest)
        if: ${{ env.NATIVE == 'true' }}
        run: |
          set -euo pipefail
          pkg=tests/e2e/wootc-files/native-shell
          public=$(tr -d ' \n' < "$WOOTC_E2E_MANIFEST_PUBLIC")
          ( cd app && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
              -ldflags "-H windowsgui -X main.nativeBuildID=${{ github.sha }} -X main.brandID=$WOOTC_E2E_BRAND -X main.artifactPublicKey=$public" \
              -o "../$pkg/wootc-engine.exe" . )
          # write compares the shell's Branding/brand.json with this brand's
          # source, so a shell published for another brand is refused here.
          python3 tests/e2e/native-package.py write "$pkg" "${{ github.sha }}" "$WOOTC_E2E_BRAND" "app/branding/$WOOTC_E2E_BRAND/brand.json"
          python3 tests/e2e/native-package.py check "$pkg"
          du -sh "$pkg"
          # The native-shell job compiles the installer around these two.
          mkdir -p "$RUNNER_TEMP/native-engine"
          cp "$pkg/wootc-engine.exe" "$pkg/native-package.json" "$RUNNER_TEMP/native-engine/"
          echo ok > "$RUNNER_TEMP/native-engine/status.txt"

      - id: native_engine
        if: ${{ env.NATIVE == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.NATIVE_ENGINE_ARTIFACT }}
          path: ${{ runner.temp }}/native-engine/
          if-no-files-found: error
          retention-days: 3

      # Best-effort: pull a pre-installed Windows base image (primed by
      # e2e-snapshot.yml) so run-e2e.sh restores it instead of reinstalling
      # Windows. A miss (no such tag / stale key) is fine — run-e2e.sh falls
      # back to a full install, so this never gates a run.
      - name: Pull pre-installed Windows base image (if present)
        if: ${{ inputs.use_base_image }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Expression results interpolated into shell, not passed as $-vars,
          # let a value containing "/`/$() break out of the TAG= assignment
          # and execute arbitrary shell on the runner. win_version/win_edition/
          # bitlocker are workflow_call inputs — currently only repo-controlled
          # callers, but the hazard is the same class as inputs.image below.
          # See #154.
          WOOTC_E2E_WIN_VERSION_TAG: ${{ inputs.win_version }}
          WOOTC_E2E_WIN_EDITION_TAG: ${{ inputs.win_edition || 'pro' }}
          WOOTC_E2E_BITLOCKER_TAG: ${{ inputs.bitlocker }}
        run: |
          set -euo pipefail
          VERSION=1.2.0
          curl -fsSL -o oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          tar -xzf oras.tar.gz oras && sudo install -m 0755 oras /usr/local/bin/oras
          PKG="ghcr.io/${{ github.repository_owner }}/wootc-winbase"
          # Tag includes the EDITION: the product key selects the edition inside the
          # ISO and is folded into the snapshot correctness key, so a pro-primed
          # snapshot can never serve a home cell (it would be silently rejected).
          TAG="${WOOTC_E2E_WIN_VERSION_TAG}-${WOOTC_E2E_WIN_EDITION_TAG}-bl-${WOOTC_E2E_BITLOCKER_TAG}"
          echo "$GITHUB_TOKEN" | \
            oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo mkdir -p /mnt/wootc-snapshot && sudo chown "$USER" /mnt/wootc-snapshot
          if oras pull "${PKG}:${TAG}" -o /mnt/wootc-snapshot; then
            echo "WOOTC_E2E_SNAPSHOT_IN=/mnt/wootc-snapshot" >> "$GITHUB_ENV"
            echo "Restored base image ${PKG}:${TAG}"; ls -lh /mnt/wootc-snapshot
          else
            echo "No base image ${PKG}:${TAG}; run-e2e.sh will do a full install"
          fi

      - name: Wait for the native preview installer
        if: ${{ env.NATIVE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-run-artifact.sh 3600 "$NATIVE_INSTALLER_ARTIFACT"

      - name: Download the native preview installer
        if: ${{ env.NATIVE == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.NATIVE_INSTALLER_ARTIFACT }}
          path: ${{ runner.temp }}/native-installer

      # inno: the guest runs the real installer. inno-unavailable: the runner
      # could not download the pinned compiler, so the guest gets a robocopy
      # of the package, loudly. Anything else stops the run.
      - name: Stage the native preview installer
        if: ${{ env.NATIVE == 'true' }}
        run: |
          set -euo pipefail
          got="$RUNNER_TEMP/native-installer"
          status=$(tr -d '\r\n' < "$got/status.txt")
          case "$status" in
            inno)
              mkdir -p tests/e2e/wootc-files/native-installer
              cp "$got/$WOOTC_E2E_BRAND-native-preview-${{ github.sha }}.exe" tests/e2e/wootc-files/native-installer/
              ls -l tests/e2e/wootc-files/native-installer
              cat "$got/compiler-observations.json" || true
              echo "WOOTC_E2E_NATIVE_INSTALLER=inno" >> "$GITHUB_ENV" ;;
            inno-unavailable)
              echo "::warning::the pinned Inno compiler was unavailable; this run copies the package with robocopy and does NOT prove the preview installer"
              echo "WOOTC_E2E_NATIVE_INSTALLER=robocopy" >> "$GITHUB_ENV" ;;
            *)
              echo "::error::the native-shell job did not produce the preview installer (status: $status)"; exit 1 ;;
          esac

      - name: Run the E2E (restores base image if pulled, else full install)
        env:
          # 16 GB runner: leave headroom for podman + the deployer build.
          WOOTC_E2E_RAM_SIZE: 6G
          # 4 vCPU hosted runners are slower than the laptop runners;
          # the laptops themselves hit the 45 min default on big images.
          WOOTC_E2E_DEPLOY_TIMEOUT: '5400'   # 90 min
          # The 8-wide matrix contends for CPU/disk; the pre-deploy Windows
          # install then overran the 2700s (~66 wall-min) QGA window on some
          # cells (el10-xfce, el10-gnome-win10home 20260724). Widen it — this is
          # runner contention, not a product timeout.
          WOOTC_E2E_WINDOWS_QGA_TIMEOUT: '3600'   # ~88 wall-min after loop overhead
          WOOTC_E2E_WIN_VERSION: ${{ inputs.win_version }}
          WOOTC_E2E_WIN_EDITION: ${{ inputs.win_edition }}
          WOOTC_E2E_WIN_KEY: ${{ inputs.win_key }}
          WOOTC_E2E_BITLOCKER: ${{ inputs.bitlocker }}
          # Explicit BitLocker Documents acceptance: editable Linux copy plus
          # real GNOME Save/close/reopen and post-restart persistence.
          WOOTC_E2E_GUI_DOCUMENTS: ${{ inputs.gui_documents && '1' || '0' }}
          # Do NOT grow the guest disk for BitLocker: a hosted runner has only
          # ~81 GB free in /storage, so a 140G image made dockur spend startup
          # resizing, which starved swtpm's launch window — it then silently
          # DISABLED TPM and the run failed "missing TPM 2.0 or Secure Boot"
          # (run 30183222185, container.log). Keep 80G and shrink what we carve
          # instead: root.disk 25 GiB + 20 GiB scratch + 6 GiB headroom = 51 GiB,
          # which an ~79 GiB C: holding ~16 GiB of Windows can actually give up.
          WOOTC_E2E_ROOT_DISK_GIB: ${{ inputs.bitlocker == 'on' && '25' || '35' }}
          # Rung 3: hand the guest a blank 40G second disk as the graduate target.
          # Empty string when phase3=false → dockur adds no second disk.
          WOOTC_E2E_DISK2_SIZE: ${{ inputs.phase3 && '40G' || '' }}
          # Empty string → run-e2e.sh's per-image heuristic picks the bootloader.
          WOOTC_E2E_BOOTLOADER: ${{ inputs.bootloader }}
          # Empty string → the deployer's own filesystem default.
          WOOTC_E2E_FILESYSTEM: ${{ inputs.filesystem }}
          # WOOTC_E2E_SNAPSHOT_IN is set by the pull step above on a cache hit.
          # Drive mode gate for the app's E2E bindings (inert otherwise).
          WOOTC_E2E_DRIVE: ${{ inputs.gui_install && '1' || '' }}
          # Which GUI the drive operates; run-e2e.sh refuses anything else.
          WOOTC_E2E_GUI_FRONTEND: ${{ inputs.gui_frontend }}
          # Native: 1 starts the shell unelevated (see gui-native.sh).
          WOOTC_E2E_NATIVE_UNELEVATED: ${{ inputs.native_unelevated && '1' || '0' }}
          # Passed as a $-var, not interpolated into the run: block, so a
          # value containing "/`/$() in this attacker-influenceable
          # workflow_dispatch input cannot execute shell on the runner. See #154.
          #
          # DO NOT name this WOOTC_E2E_IMAGE. That name is already taken by the
          # harness for the *Windows container* image (compose.yml's `image:`
          # and run-e2e.sh's dockur preflight both read it, defaulting to
          # localhost/wootc-e2e-windows-ssh:latest). Because `env:` exports to
          # the whole step, setting it here handed podman-compose the *bootc
          # target* image instead, so the "Windows VM" was really a bootc OS
          # container: it booted systemd, never ran QEMU, and every run died on
          # "QEMU did not start within 15 minutes" with an empty container.log
          # and a guest process list full of gdm/NetworkManager. That is #166,
          # introduced here by 2617aed (#159) on 2026-08-14.
          WOOTC_TARGET_IMAGE: ${{ inputs.image }}
          WOOTC_FAULT_INJECT: ${{ inputs.fault_inject }}
          WOOTC_E2E_FIRMWARE_DB: ${{ inputs.firmware_db }}
        run: |
          cd tests/e2e
          FLAGS=()
          [ "${{ inputs.phase3 }}" = "true" ] && FLAGS+=(--phase3)
          [ "${{ inputs.offline }}" = "true" ] && FLAGS+=(--offline)
          [ "${{ inputs.gui_install }}" = "true" ] && FLAGS+=(--gui-install)
          [ "${{ inputs.uninstall_check }}" = "true" ] && FLAGS+=(--uninstall-check)
          [ -n "$WOOTC_FAULT_INJECT" ] && FLAGS+=("--fault-inject=$WOOTC_FAULT_INJECT")
          # tee the run's own log. GitHub withholds workflow logs until the
          # ENTIRE matrix finishes, so without this a failing cell cannot be
          # diagnosed for hours — the evidence artifact is the only way in.
          set -o pipefail
          bash run-e2e.sh "$WOOTC_TARGET_IMAGE" "${FLAGS[@]}" 2>&1 | python3 safe-log.py | tee /tmp/run-e2e-console.log

      # Surface the harness's own flake classification (written ONLY when the
      # failure matched a known infra signature — see note_flake in
      # run-e2e.sh). Callers gate a single automated re-dispatch on this;
      # empty means real failure, never retried.
      - name: Read flake verdict
        id: flake
        if: always()
        run: |
          v=$(cat tests/e2e/storage/flake-verdict.txt 2>/dev/null | head -1 | tr -cd 'a-z-')
          echo "verdict=$v" >> "$GITHUB_OUTPUT"
          [ -n "$v" ] && echo "::notice::run-e2e.sh classified this failure as a flake: $v" || true

      - name: Tell the native-shell job this job failed
        if: ${{ failure() && env.NATIVE == 'true' && steps.native_engine.outcome != 'success' }}
        run: mkdir -p "$RUNNER_TEMP/native-failed" && echo failed > "$RUNNER_TEMP/native-failed/status.txt"
      - if: ${{ failure() && env.NATIVE == 'true' && steps.native_engine.outcome != 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.NATIVE_ENGINE_ARTIFACT }}
          path: ${{ runner.temp }}/native-failed/
          retention-days: 3

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p /tmp/evidence
          cp -r tests/e2e/storage/artifacts/. /tmp/evidence/ 2>/dev/null || true
          cp tests/e2e/storage/run-e2e.current /tmp/evidence/ 2>/dev/null || true
          cp /tmp/run-e2e-console.log /tmp/evidence/ 2>/dev/null || true
          # The failure ledger names exactly which assertions failed. Without it
          # a run that "exited 1" after a Phase-2 boot that LOOKED healthy gives
          # no clue which check was the one that fired (el10-xfce-win11pro,
          # 20260727T020541Z).
          cat /tmp/wootc-e2e-failures.* /home/runner/.wootc-tmp/wootc-e2e-failures.* \
              > /tmp/evidence/failure-ledger.txt 2>/dev/null || true
          # the raw serial is the single most useful post-mortem artifact
          cp tests/e2e/storage/qemu.pty /tmp/evidence/qemu-serial.log 2>/dev/null || true
          du -sh /tmp/evidence || true

      # DISK-LEVEL POST-MORTEM. The lesson from the Phase-2 attach bug: disk
      # archaeology beats serial capture. The deployer's serial is overwritten by
      # the Phase-2 boot, and its persistent log (C:\wootc\logs\deployer.log) is
      # unreachable over QGA once Phase 2 lands in a Linux emergency shell — but
      # both, plus the actual BOOTED initramfs, are sitting in data.qcow2. Read
      # them with libguestfs so every hosted run is self-diagnosing without SSH.
      # Surfaces: the guard verdict, AND whether wootc-attach.service is present
      # AND WIRED (a dangling wants symlink is the exact bug that hid for a week).
      - name: Disk post-mortem (libguestfs)
        if: always()
        continue-on-error: true
        run: |
          set +e
          D=tests/e2e/storage/data.qcow2
          [ -f "$D" ] || { echo "no data.qcow2 — nothing to inspect"; exit 0; }
          sudo apt-get install -y -qq libguestfs-tools >/dev/null 2>&1
          export LIBGUESTFS_BACKEND=direct
          mkdir -p /tmp/evidence
          virt-filesystems -a "$D" --long > /tmp/evidence/disk-filesystems.txt 2>&1
          # Deployer's persistent log (guard verdict lives here); inspection mounts Windows C:.
          virt-cat -a "$D" /wootc/logs/deployer.log > /tmp/evidence/deployer.log 2>/dev/null
          echo "=== GUARD VERDICT (from deployer.log) ==="
          grep -aE 'guard:|dracut regen|WIRED|wired|matches=|unit file present' /tmp/evidence/deployer.log 2>/dev/null | tail -15
          # DURABLE verify-stage marker, written to the DEPLOYED /boot (not the
          # NTFS-hosted deployer.log, which truncates silently). Its LAST line is
          # exactly how far verify got — the discriminator for a composefs deploy
          # that aborts before ESP staging on a read-only /usr write. /boot is an
          # ext4/xfs partition inside data.qcow2; find and read it directly.
          echo "=== VERIFY STAGE MARKER (from deployed /boot) ==="
          for BOOTFS in $(virt-filesystems -a "$D" 2>/dev/null); do
            virt-cat -a "$D" -m "$BOOTFS" /wootc-verify.stage 2>/dev/null && break
            virt-cat -a "$D" -m "$BOOTFS" /boot/wootc-verify.stage 2>/dev/null && break
          done > /tmp/evidence/verify-stage.txt
          cat /tmp/evidence/verify-stage.txt || echo "(no verify-stage marker — deploy aborted before /boot was mounted, or never reached verify)"
          # The BOOTED Phase-2 initramfs from the ESP: present AND wired?
          # virt-filesystems -l columns: Name Type VFS Label … — VFS (vfat) is
          # field 3, not 2. (The $2 bug meant this never found the ESP.)
          ESP=$(virt-filesystems -a "$D" -l 2>/dev/null | awk '$3=="vfat"{print $1; exit}')
          if [ -n "$ESP" ]; then
            virt-cat -a "$D" -m "$ESP" /EFI/wootc/phase2-initramfs.img > /tmp/p2.img 2>/dev/null
            if [ -s /tmp/p2.img ]; then
              lsinitrd /tmp/p2.img > /tmp/evidence/phase2-initramfs-list.txt 2>/dev/null
              WIRED=$(grep -cE 'initrd-root-device.target.wants/wootc-attach.service' /tmp/evidence/phase2-initramfs-list.txt)
              UNIT=$(grep -cE 'usr/lib/systemd/system/wootc-attach\.service$' /tmp/evidence/phase2-initramfs-list.txt)
              echo "=== BOOTED Phase-2 initramfs: wootc-attach wants-symlink=$WIRED unit-file=$UNIT ==="
              [ "$WIRED" -ge 1 ] && [ "$UNIT" -lt 1 ] && echo "::warning::DANGLING wootc-attach.service — wants symlink present but unit file absent (root.disk will never attach)"
            fi
          fi
          du -sh /tmp/evidence || true

      - name: Sanitize diagnostic text before publication
        id: safe_logs
        if: always()
        run: python3 tests/e2e/safe-log.py --tree /tmp/evidence

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.safe_logs.outcome == 'success'
        with:
          # Per-CASE name. Every cell used to upload "e2e-nightly-<run_id>", so
          # `gh run download` merged them and only ONE failure's evidence
          # survived — with 3 cells red, 2 were unreadable.
          name: e2e-${{ inputs.case_name || 'run' }}-${{ github.run_id }}
          path: /tmp/evidence
          retention-days: 14
          if-no-files-found: warn
          # The green-run gate is a DOTFILE (video/.passed), and this action
          # excludes hidden files by default — so run 30506080617 passed all
          # three phases, uploaded 1410 files, and still could not publish its
          # timelapse: the one file proving it was green had been stripped.
          include-hidden-files: true

      - name: Tear down
        if: always()
        run: |
          cd tests/e2e
          podman rm -f wootc-e2e-windows 2>/dev/null || true
