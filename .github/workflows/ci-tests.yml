name: tests

# Everything here runs on FREE GitHub-hosted runners with no VM, no KVM and no
# self-hosted anything — the fast bats suites, the cross-platform Go tests, the
# containerized migration integration suite, and the GUI screenshot render.
# These were being run by hand on laptops; they belong on every push to main
# and on every PR that touches their inputs (see the changes job).
#
# The Windows-VM E2E is deliberately NOT here: it needs KVM + a full Windows
# install (~45-85 min) and has no persistent disk on hosted runners. See
# e2e-kvm.yml / tests/e2e/run-matrix.sh for that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every main/dispatch verdict, including queued runs (#363).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path scoping: on a pull request, the fast tier always runs and every other
  # job runs only when the change touches its inputs
  # (.github/scripts/ci-scope.sh owns the map). Push to main and
  # workflow_dispatch always run every job.
  changes:
    name: select path-scoped jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classic: ${{ steps.scope.outputs.classic }}
      migration: ${{ steps.scope.outputs.migration }}
      partition: ${{ steps.scope.outputs.partition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR merge commit and its base parent.
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | tee /dev/stderr | .github/scripts/ci-scope.sh >> "$GITHUB_OUTPUT"
          else
            .github/scripts/ci-scope.sh --all >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  fast:
    name: fast tier (bats + go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {submodules: recursive}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: {go-version: '1.27', cache: false}
      - name: Install native fast-tier fixture dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats rsync qemu-system-common qemu-system-gui binutils
      - name: Fetch coverage comparison base
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$COVERAGE_BASE_SHA"
      - name: Run fast tier and enforce Go coverage
        env:
          WOOTC_COVERAGE_DIR: ${{ runner.temp }}/go-coverage
          WOOTC_COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash tests/run.sh fast
      - name: Upload Go coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-coverage
          path: ${{ runner.temp }}/go-coverage
          if-no-files-found: error

  classic-offline:
    name: classic offline package prerequisites
    needs: changes
    if: needs.changes.outputs.classic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require native simulation tools
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          /usr/bin/dpkg-deb --version
          /usr/bin/apt-get --version
      - name: Execute consumer controls and exact source audit
        run: |
          python3 -m unittest discover -s tests/unit -p test_wootc_package_consumer.py
          python3 tests/audit-classic-offline.py .

  integration:
    name: migration integration (container)
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {submodules: recursive}
      - uses: ./.github/actions/podman-runtime
      - name: Run containerized bridge suite
        run: bash tests/migration/test-bridge.sh

  gui-shots:
    name: GUI screenshots render
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/podman-runtime
      - name: Render the Linux GUIs headlessly
        run: bash tests/gui/capture-linux-guis.sh
      - name: Fail if any screenshot came out blank
        run: |
          for f in docs/screenshots/1[3-6]-*.png; do
            sz=$(stat -c%s "$f")
            echo "$f: $sz bytes"
            [ "$sz" -gt 5000 ] || { echo "::error::$f is blank ($sz bytes)"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-gui-screenshots
          path: docs/screenshots/1[3-6]-*.png
          if-no-files-found: error

  partition-policy:
    name: Windows partition policy counterexamples
    needs: changes
    if: needs.changes.outputs.partition == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate PowerShell policy and execute mocked storage controls
        shell: powershell
        run: |
          & ./tests/lint-ps1.ps1 -Files @('app/partition-policy.ps1', 'app/partition-policy.tests.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell policy lint failed' }
          & ./app/partition-policy.tests.ps1
