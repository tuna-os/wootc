name: WinUI preview

on:
  pull_request:
    paths:
      - 'shell/**'
      - 'tests/native_configuration_flush_controls.py'
      - 'tests/windows_owned_process.py'
      - 'app/serve*'
      - 'app/native_peer*'
      - 'app/native_pipe*'
      - 'app/native_handshake*'
      - 'app/native_package*'
      - 'app/native_serve*'
      - 'app/native_readiness*'
      - 'app/native_audit*'
      - 'app/native_configuration*'
      - 'app/native_storage*'
      - 'app/main.go'
      - 'app/status_location*'
      - 'app/tools/gendto/**'
      - '.github/workflows/winui-preview.yml'
  # A release published by a person triggers this directly. Releases cut by
  # release.yml use GITHUB_TOKEN, which never triggers other workflows, so
  # those are attached by dispatching this workflow at the release tag with
  # release_tag set. Nothing here publishes to winget.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the native preview installers to this existing release (dispatch at that tag). Empty = build and test only.'
        type: string
        default: ''
  # Nightly: the full branded-package matrix (a PR runs a rotating slice).
  schedule:
    - cron: '40 4 * * *'

permissions:
  contents: read

concurrency:
  group: winui-preview-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branded packages are the same code with a different brand.json. A PR
  # packages WINUI_PREVIEW_BRANDS_PER_PR brands (repo variable, default 1),
  # rotated by run number, plus every brand whose app/branding/<brand>/ it
  # changes. Schedule and dispatch package every brand.
  plan:
    name: Select preview brands
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      brands: ${{ steps.pick.outputs.brands }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR merge commit and its base parent.
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          PER_PR: ${{ vars.WINUI_PREVIEW_BRANDS_PER_PR || '1' }}
        run: |
          set -euo pipefail
          all=(wootc tunaos aurora bazzite bluefin)
          n=${#all[@]}
          declare -A want=()
          if [ "$EVENT" != pull_request ]; then
            for b in "${all[@]}"; do want[$b]=1; done
          else
            [[ "$PER_PR" =~ ^[0-9]+$ ]] && [ "$PER_PR" -ge 1 ] || { echo "::error::WINUI_PREVIEW_BRANDS_PER_PR must be a positive integer"; exit 1; }
            if [ "$PER_PR" -gt "$n" ]; then PER_PR=$n; fi
            start=$(( RUN_NUMBER * PER_PR % n ))
            for ((i = 0; i < PER_PR; i++)); do want[${all[(start + i) % n]}]=1; done
            changed=$(git diff --name-only HEAD^1 HEAD)
            while IFS= read -r f; do
              case "$f" in
                app/branding/*/*)
                  b=${f#app/branding/}; b=${b%%/*}
                  for known in "${all[@]}"; do [ "$b" != "$known" ] || want[$b]=1; done ;;
              esac
            done <<< "$changed"
          fi
          picked=()
          for b in "${all[@]}"; do [ -z "${want[$b]:-}" ] || picked+=("$b"); done
          brands=$(printf '%s\n' "${picked[@]}" | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "brands=$brands" | tee -a "$GITHUB_OUTPUT"

  core:
    name: Core startup contract (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: shell/global.json
      - name: Run startup, route and refusal counterexamples
        working-directory: shell
        run: dotnet test Wootc.Shell.Tests --configuration Release --logger "trx;LogFileName=core.trx"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: winui-core-${{ matrix.os }}
          path: shell/Wootc.Shell.Tests/TestResults/*.trx
          if-no-files-found: error

  native-build:
    name: Native preview XAML and packaging build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: shell/global.json
      - name: Restore and publish the native preview
        working-directory: shell
        run: dotnet publish Wootc.Shell/Wootc.Shell.csproj --configuration Release --runtime win-x64 -p:Platform=x64 -p:NativeBuildId=${{ github.sha }} --output ../out/winui-preview
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod
      - name: Build the exact preview engine for authenticated startup RPC
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          Set-Content frontend/dist/index.html '<!doctype html><title>Native engine preview</title>'
          go build -ldflags "-H windowsgui -X main.nativeBuildID=${{ github.sha }}" -o ../out/winui-preview/wootc-engine.exe .
      - name: Test actual Windows adapter identities and private package controls
        working-directory: shell
        run: dotnet test Wootc.Shell.NativeTests --configuration Release -p:NativeBuildId=${{ github.sha }} --logger "trx;LogFileName=native-adapter.trx"
      - name: Prove actual current configuration flush identity and restored counter
        run: python tests/native_configuration_flush_controls.py
      - name: Observe the actual native startup window with UI Automation
        working-directory: shell
        shell: pwsh
        run: |
          $env:WOOTC_NATIVE_BUILD_ID = '${{ github.sha }}'
          $env:WOOTC_NATIVE_PREVIEW_DIAGNOSTICS = '1'
          $env:WOOTC_NATIVE_PREVIEW_EXE = Join-Path $env:GITHUB_WORKSPACE 'out/winui-preview/Wootc.Shell.exe'
          dotnet test Wootc.Shell.UiTests --configuration Release --filter FullyQualifiedName~StartupWindowTests --logger "trx;LogFileName=native-ui.trx"
      - name: Retain own preview startup event diagnostics
        if: failure()
        shell: pwsh
        run: |
          $records = @(Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in @('Application Error','.NET Runtime','Windows Error Reporting') -and $_.Message -match 'Wootc[.]Shell' } |
            Select-Object -First 8 TimeCreated, ProviderName, Id, Message)
          ConvertTo-Json -InputObject $records -Depth 3 | Set-Content -Encoding utf8 out/winui-startup-events.json
          Get-Content out/winui-startup-events.json
      - name: Retain generated XAML loader and metadata diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/winui-source-diagnostics | Out-Null
          $resourceFiles = @(Get-ChildItem shell/Wootc.Shell/bin,out/winui-preview -Recurse -File -Filter '*.pri' |
            Select-Object FullName,Length,@{Name='SHA256';Expression={(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash}})
          ConvertTo-Json -InputObject $resourceFiles -Depth 3 | Set-Content -Encoding utf8 out/winui-source-diagnostics/resource-indexes.json
          Get-ChildItem shell/Wootc.Shell/obj -Recurse -File |
            Where-Object { $_.Name -match '^(App|MainWindow|XamlTypeInfo)[.]g[.]' } |
            Copy-Item -Destination out/winui-source-diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: winui-preview-diagnostics
          path: |
            out/configuration-flush-controls/
            out/winui-source-diagnostics/
            out/winui-startup-events.json
            out/native-startup-state-observations.json
            shell/Wootc.Shell.UiTests/TestResults/*.trx
            shell/Wootc.Shell.NativeTests/TestResults/*.trx
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: winui-preview-unpackaged
          path: |
            out/winui-preview/
            shell/Wootc.Shell.UiTests/TestResults/*.trx
            out/winui-startup-events.json
          if-no-files-found: error

  native-peer:
    name: Native Windows process identity observations
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod
      - name: Observe actual process tokens and retained handles
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          Set-Content frontend/dist/index.html '<!doctype html><title>Transport unit tests</title>'
          go test -count=1 -v -timeout 60s -run '^(TestNative(PeerObservation|Pipe|Handshake|Package|Serve|Assessment|Audit)|TestStatus|TestProtocolMatchesWinuiShellSpec|TestServeStartupReadContracts)' .

  preview-packaging:
    name: Branded preview package (${{ matrix.brand }})
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(needs.plan.outputs.brands) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: shell/global.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod
      - name: Publish the selected preview brand and exact engine
        shell: pwsh
        run: |
          dotnet publish shell/Wootc.Shell/Wootc.Shell.csproj --configuration Release --runtime win-x64 -p:Platform=x64 -p:NativeBuildId=${{ github.sha }} -p:NativeBrandId=${{ matrix.brand }} --output out/branded-preview
          if ($LASTEXITCODE -ne 0) { throw 'Branded native publish refused' }
          New-Item -ItemType Directory -Force app/frontend/dist | Out-Null
          Set-Content app/frontend/dist/index.html '<!doctype html><title>Native engine preview</title>'
          Push-Location app
          try { go build -ldflags "-H windowsgui -X main.nativeBuildID=${{ github.sha }} -X main.brandID=${{ matrix.brand }}" -o ../out/branded-preview/wootc-engine.exe . } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'Branded engine build refused' }
      - name: Compile, install, observe and remove only the preview package
        shell: pwsh
        run: ./shell/packaging/test-installed-preview.ps1 -BrandId '${{ matrix.brand }}' -BuildId '${{ github.sha }}' -PackageDirectory out/branded-preview -OutputDirectory out/preview-installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: winui-preview-package-${{ matrix.brand }}
          path: |
            out/preview-installer/
            out/branded-preview/native-package.json
            shell/Wootc.Shell.UiTests/TestResults/*.trx
          if-no-files-found: error

  publish-preview:
    name: Attach native preview installers to the release
    needs: [core, native-build, native-peer, preview-packaging]
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Bind the release tag to the exact tested source
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [[ ! "$tag" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,99}$ ]]; then
            echo "::error::Refusing release tag '$tag'"; exit 1
          fi
          # The packages were built and tested at github.sha. Attach them only
          # to a release whose tag names that same commit.
          tagged=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag is $tagged; these packages were tested at $GITHUB_SHA"; exit 1
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft > release.json
          jq -e --arg t "$tag" '.tagName == $t and (.isDraft | not)' release.json > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: winui-preview-package-*
          path: preview-artifacts
      - name: Select brands by recorded blessing and name the preview assets
        run: |
          set -euo pipefail
          # The same policy as the Wails brand exes: a declined brand drops,
          # a pending one ships as it does today. The preview never adds a
          # brand the release matrix would not build.
          brands=$(bash packaging/brands.sh list)
          [ -n "$brands" ] || { echo "::error::no brand is buildable"; exit 1; }
          mkdir preview-assets
          while IFS=$'\t' read -r brand exe; do
            src="preview-artifacts/winui-preview-package-$brand/out/preview-installer/$brand-native-preview-$GITHUB_SHA.exe"
            [ -s "$src" ] || { echo "::error::missing tested preview installer for $brand"; exit 1; }
            cp "$src" "preview-assets/$exe-Native-Preview-Setup.exe"
          done <<< "$brands"
          ( cd preview-assets && sha256sum -- *.exe > native-preview-SHA256SUMS )
          cat preview-assets/native-preview-SHA256SUMS
      - name: Upload beside the existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # No --clobber: a preview never replaces an asset already published.
          gh release upload "$TAG" preview-assets/* --repo "$GITHUB_REPOSITORY"
