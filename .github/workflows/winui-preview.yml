name: WinUI preview

on:
  pull_request:
    paths:
      - 'shell/**'
      - 'app/serve*'
      - 'app/tools/gendto/**'
      - '.github/workflows/winui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winui-preview-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core startup contract (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: shell/global.json
      - name: Run startup, route and refusal counterexamples
        working-directory: shell
        run: dotnet test Wootc.Shell.Tests --configuration Release --logger "trx;LogFileName=core.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: winui-core-${{ matrix.os }}
          path: shell/Wootc.Shell.Tests/TestResults/*.trx
          if-no-files-found: error

  native-build:
    name: Native preview XAML and packaging build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: shell/global.json
      - name: Restore and publish the native preview
        working-directory: shell
        run: dotnet publish Wootc.Shell/Wootc.Shell.csproj --configuration Release --runtime win-x64 -p:Platform=x64 --output ../out/winui-preview
      - uses: actions/upload-artifact@v7
        with:
          name: winui-preview-unpackaged
          path: out/winui-preview/
          if-no-files-found: error
