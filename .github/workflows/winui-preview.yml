name: WinUI preview

on:
  pull_request:
    paths:
      - 'shell/**'
      - 'app/serve*'
      - 'app/tools/gendto/**'
      - '.github/workflows/winui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winui-preview-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core startup contract (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: shell/global.json
      - name: Run startup, route and refusal counterexamples
        working-directory: shell
        run: dotnet run --project Wootc.Shell.Tests --configuration Release
