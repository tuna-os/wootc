name: Release

# E2E-GATED RELEASE, two channels, one pipeline (docs/branding-and-distribution.md §1):
#
#   tag v* / dispatch ─► tests ─► E2E gate (real Windows VM) ─► build + publish
#   nightly GUI E2E green on main (workflow_run) ────────────► build + publish
#                                                              (auto-vYYYYMMDD-<sha>, pre-release)
#
# The tagged channel proves the exact tag with a fresh E2E run. The auto
# channel's gate is the green nightly that triggered it: the release is cut
# from the exact SHA the nightly proved, so no additional VM time is burned.
# No green nightly, no auto release. wootc writes to a stranger's only
# computer — "the unit tests passed" is not a sufficient bar to ship on.
#
# Every release ships the FULL artifact set — one exe per brand plus the
# shared boot artifacts (deployer kernel/initramfs, signed shim+GRUB,
# wubildr) and a SHA256SUMS the installer's fail-closed verification (#53)
# requires. Publishing wootc.exe alone left deployerBaseURL() pointing at
# assets that never existed (#196): a plain online install could never work.

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['E2E GUI-driven (publish timelapse)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish as this tag (e.g. v0.1.0) — a FULL release, created by the workflow itself. Empty = manual-v* pre-release.'
        type: string
        default: ''
      skip_e2e:
        description: 'Emergency: publish WITHOUT the E2E gate (documents itself in the release notes)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: read                 # granted through to the reusable e2e-hosted (base-image pull)
  actions: write                 # publish job dispatches winget-publish.yml for full releases

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'auto' || github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. cheap signal first: never burn ~90 min of VM on a broken tree ───────
  # Tag/dispatch channel only — the auto channel's SHA already passed the
  # nightly, which runs these same suites en route.
  tests:
    name: fast + integration
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: actions/setup-go@v7
        with: { go-version: '1.27', cache: false }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - run: bash tests/run.sh fast
      - uses: ./.github/actions/podman-runtime
      - run: bash tests/migration/test-bridge.sh

  # ── 2. the gate: a real Windows VM migrates to Linux and back ─────────────
  e2e-gate:
    name: E2E gate (real Windows VM)
    needs: tests
    if: ${{ github.event_name != 'workflow_run' && !inputs.skip_e2e }}
    uses: ./.github/workflows/e2e-hosted.yml
    with:
      # Gate on the alpha image, driven through the REAL GUI — the release is
      # proven the way a user installs it (docs/RELEASING.md).
      image: ghcr.io/projectbluefin/bluefin:lts
      win_version: '11'
      bitlocker: 'off'
      gui_install: true
      phase3: true

  # ── 3. publish — only reachable when a gate passed (or was waived) ────────
  publish:
    name: build + publish
    needs: [tests, e2e-gate]
    if: >-
      ${{ always() && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name != 'workflow_run' && needs.tests.result == 'success' &&
          (needs.e2e-gate.result == 'success' || inputs.skip_e2e))
      ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Auto channel: build the exact SHA the nightly proved, not
          # whatever main has moved to since.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      # Reclaim BEFORE the tool setups, and never touch the toolcache: the
      # first publish run (32557070841) deleted $AGENT_TOOLSDIRECTORY and
      # /usr/local/lib/node_modules AFTER setup-node had installed Node
      # there — npm vanished, the brand build died, and a PASSED E2E gate
      # was thrown away one job later. dotnet/android/ghc/boost/swift free
      # ~25 GB, which is all the deployer image build needs.
      - name: Reclaim disk (the deployer image build needs the room)
        run: |
          df -h / || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          echo "--- after cleanup ---"; df -h /

      - uses: actions/setup-go@v7
        with: { go-version: '1.27', cache: false }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - uses: ./.github/actions/podman-runtime

      - name: Resolve channel + tag
        id: chan
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            echo "tag=auto-v$(date -u +%Y%m%d)-${sha::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=auto" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=tagged" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            # Dispatch with an explicit tag: a FULL release. The release
            # action creates the tag at the dispatched SHA using the
            # workflow's own token, so cutting a release needs no tag-push
            # rights anywhere else — pick the branch, name the tag, and the
            # same E2E gate stands in front of it.
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=tagged" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch from a branch: synthesize a tag rather than
            # publishing a release literally named "main".
            echo "tag=manual-v$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=manual" >> "$GITHUB_OUTPUT"
          fi

      - name: Build brand installers (one exe per brand)
        # Subshells for every directory change: the first run interleaved a
        # failed `cd`/build chain with a loop that then globbed from the
        # wrong directory. Nothing here moves the step's own cwd.
        run: |
          set -euo pipefail
          (cd app/frontend && npm ci && npm run build)
          mkdir -p release-assets
          for dir in app/branding/*/; do
            brand=$(basename "$dir")
            exe=$(jq -r '.exeName // empty' "$dir/brand.json")
            [ -n "$exe" ] || { echo "::error::$dir/brand.json has no exeName"; exit 1; }
            (cd app && GOOS=windows GOARCH=amd64 go build -tags desktop,production \
              -ldflags "-w -s -X main.brandID=$brand" -o "../release-assets/$exe.exe" .)
            echo "built $exe.exe (brand: $brand)"
          done
          ls -lh release-assets/

      - name: Build deployer boot artifacts
        # The same builds the E2E harness performs (tests/e2e/run-e2e.sh):
        # deployer kernel+initramfs out of the deployer image, signed
        # shim+GRUB out of a Fedora container, wubildr best-effort.
        run: |
          set -euo pipefail
          podman build -t wootc-deployer -f payload/deployer/Containerfile .
          for artifact in deployer-vmlinuz deployer-initramfs.img; do
            podman run --rm --entrypoint /bin/cat wootc-deployer "/out/$artifact" \
              > "release-assets/$artifact"
            [ -s "release-assets/$artifact" ] || { echo "::error::empty $artifact"; exit 1; }
          done
          CID=$(podman create quay.io/fedora/fedora:44 \
            bash -c "dnf install -y -q shim-x64 grub2-efi-x64 2>/dev/null && \
              cp /boot/efi/EFI/fedora/shimx64.efi /tmp/ && \
              cp /boot/efi/EFI/fedora/grubx64.efi /tmp/ && echo DONE")
          podman start -a "$CID"
          podman cp "$CID:/tmp/shimx64.efi" release-assets/shimx64.efi
          podman cp "$CID:/tmp/grubx64.efi" release-assets/grubx64.efi
          podman rm "$CID"
          [ -s release-assets/shimx64.efi ] && [ -s release-assets/grubx64.efi ] || {
            echo "::error::signed shim/GRUB extraction failed"; exit 1; }
          # wubildr is best-effort in the harness too — the signed shim chain
          # is the fallback path.
          if podman build -t wootc-wubildr -f payload/wubildr/Containerfile .; then
            podman run --rm --entrypoint /bin/cat wootc-wubildr /out/wubildr.efi \
              > release-assets/wubildr.efi || rm -f release-assets/wubildr.efi
          fi
          ls -lh release-assets/
        working-directory: ${{ github.workspace }}

      - name: Checksums for the release assets
        # The installer's fail-closed verification (#53/#194) and the
        # getting-started doc both point users at a SHA256SUMS on the
        # release. Publishing assets without one broke that promise — the
        # live release 404'd it and every install died at "cannot verify
        # boot artifacts" (run 32549251225).
        run: |
          cd release-assets && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Record what gated this build
        run: |
          {
            echo "## wootc ${{ steps.chan.outputs.tag }}"
            echo
            if [ "${{ steps.chan.outputs.channel }}" = "auto" ]; then
              echo "Automated pre-release, cut from the exact commit the nightly"
              echo "GUI-driven E2E just proved: a real Windows 11 VM installed this"
              echo "build through the GUI, booted natively into Linux from"
              echo "\`root.disk\`, and returned to Windows cleanly."
              echo
              echo "Gate run: ${{ github.event.workflow_run.html_url }}"
            elif [ "${{ inputs.skip_e2e }}" = "true" ]; then
              echo "> ⚠️ **Published WITHOUT the E2E gate** (\`skip_e2e\`). Not verified"
              echo "> against a real Windows VM."
            else
              echo "Gated on a full end-to-end run: a real Windows 11 VM installed"
              echo "this build, booted natively into Linux from \`root.disk\`, and"
              echo "returned to Windows cleanly."
            fi
            echo
            echo "One installer per distribution — every exe is the same engine"
            echo "wearing its brand (docs/branding-and-distribution.md). The boot"
            echo "artifacts (deployer kernel/initramfs, signed shim+GRUB) are"
            echo "shared by all of them."
            echo
            echo "Walkthrough: https://tuna-os.github.io/wootc/e2e/latest/"
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.chan.outputs.tag }}
          target_commitish: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.ref_type != 'tag' && github.sha || '') }}
          prerelease: ${{ steps.chan.outputs.prerelease }}
          files: release-assets/*
          body_path: NOTES.md
          draft: false

      - name: Dispatch winget submission (full releases only)
        # winget-publish.yml listens on release:published, but releases cut
        # here are created with GITHUB_TOKEN, and GitHub never triggers
        # workflows from events its own token caused (recursion guard) — the
        # v0.1.0-alpha.1 publish proved it: 0 winget runs. An explicit
        # workflow_dispatch through the API DOES fire, so hand it the tag.
        if: ${{ steps.chan.outputs.prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run winget-publish.yml --repo "${{ github.repository }}" \
            -f tag="${{ steps.chan.outputs.tag }}"
