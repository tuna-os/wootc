name: Native assessment RPC controls

on:
  pull_request:
    paths: ['app/serve.go', 'app/serve_assessment_test.go', '.github/workflows/native-rpc-capabilities.yml']
  push:
    branches: [main, 'fix/native-preview-rpc-capabilities']
    paths: ['app/serve.go', 'app/serve_assessment_test.go', '.github/workflows/native-rpc-capabilities.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Actual Windows assessment and legacy action controls
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.27', cache: false}
      - name: Execute private marker and cancellation controls
        shell: powershell
        env:
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference='Stop'
          $originalTemp=$env:TEMP
          $common=[Environment]::GetFolderPath([Environment+SpecialFolder]::CommonApplicationData)
          $directory=Join-Path $common "wootc-assessment-controls-$([guid]::NewGuid().ToString('N'))"
          if (Test-Path -LiteralPath $directory) { throw 'Refusing existing control directory' }
          [IO.Directory]::CreateDirectory($directory) | Out-Null
          & icacls.exe $directory /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Private control ACL failed' }
          try {
            $env:TEMP=$directory
            foreach ($source in @('app/serve.go','app/serve_assessment_test.go')) {
              Write-Output "SOURCE $source SHA256 $((Get-FileHash -LiteralPath $source).Hash)"
            }
            & git rev-parse HEAD
            & go version
            $assets=Join-Path 'app/frontend' 'dist'
            if (Test-Path -LiteralPath $assets) { throw 'Refusing unexpected prebuilt assets' }
            [IO.Directory]::CreateDirectory($assets) | Out-Null
            [IO.File]::WriteAllText((Join-Path $assets 'index.html'),'<title>Unit-test embed placeholder</title>')
            Push-Location app
            try {
              & go test -count=1 -v -run '^TestAssessmentRPCObservedCancellationAndShutdown$' .
              if ($LASTEXITCODE -ne 0) { throw 'Actual assessment/legacy control failed' }
            } finally { Pop-Location }
          } finally {
            $env:TEMP=$originalTemp
            Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction Stop
          }
