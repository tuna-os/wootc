name: Disposable Linux package installation proof

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed 40-hex source commit (must match selected ref)
        required: true
        type: string
  pull_request:
    paths:
      - tests/e2e/package-runtime/**
      - tests/unit/test_linux_package_*.py
      - .github/workflows/linux-package-execute.yml

permissions:
  contents: read

concurrency:
  group: linux-package-execute-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native ELF fixture tools without starting a guest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf genisoimage binutils
      - name: Authenticate private host resources and verify isolated closure without a guest
        run: |
          HOST_DATA_PREFIX="/run/wootc-package-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,RUNNER_TEMP \
            /usr/bin/python3 tests/e2e/package-runtime/host-data.py "$HOST_DATA_PREFIX"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,RUNNER_TEMP \
            /usr/bin/python3 tests/e2e/package-runtime/host-namespace.py "$HOST_DATA_PREFIX" --probe
      - run: python3 -m unittest discover -s tests/unit -p 'test_linux_package_*.py'
      - name: Retain bounded host authentication and namespace proof
        if: always()
        run: |
          HOST_DATA_PREFIX="/run/wootc-package-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,RUNNER_TEMP \
            /usr/bin/python3 tests/e2e/package-runtime/host-data-proof.py "$HOST_DATA_PREFIX" "$RUNNER_TEMP/host-data-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: host-data-proof-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-data-proof/
          if-no-files-found: warn
          retention-days: 14
  execute:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      REVIEWED_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require reviewed exact source on an exclusive fresh hosted runner
        run: |
          OWNED_STAGE="$RUNNER_TEMP/linux-package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "OWNED_STAGE=$OWNED_STAGE" >> "$GITHUB_ENV"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_SHA" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test ! -e "$OWNED_STAGE"
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('/proc').glob('[0-9]*/comm'):
              try: name=path.read_text().strip()
              except (FileNotFoundError,ProcessLookupError): continue
              if name.startswith(('qemu','swtpm')): raise SystemExit('existing VM process: refuse reclaim')
          PY
      - name: Reclaim only preinstalled toolchains before any owned VM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift
          sudo apt-get clean
          df -h "$RUNNER_TEMP"
      - name: Install host tools without guest package injection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf genisoimage
          sudo chmod 0666 /dev/kvm
      - name: Authenticate new protected host data prefix
        run: |
          HOST_DATA_PREFIX="/run/wootc-package-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "WOOTC_HOST_DATA_PREFIX=$HOST_DATA_PREFIX" >> "$GITHUB_ENV"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,RUNNER_TEMP \
            /usr/bin/python3 tests/e2e/package-runtime/host-data.py "$HOST_DATA_PREFIX"
      - name: Verify source pins and execute one owned disposable probe
        run: |
          python3 tests/audit-linux-package-runtime.py .
          timeout --signal=TERM --kill-after=10s 3600s \
            sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,RUNNER_TEMP,WOOTC_HOST_DATA_PREFIX \
            /usr/bin/python3 tests/e2e/package-runtime/host-namespace.py "$WOOTC_HOST_DATA_PREFIX" --execute "$OWNED_STAGE"
      - name: Retain bounded host authentication and namespace proof
        if: always()
        run: |
          HOST_DATA_PREFIX="/run/wootc-package-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,RUNNER_TEMP \
            /usr/bin/python3 tests/e2e/package-runtime/host-data-proof.py "$HOST_DATA_PREFIX" "$RUNNER_TEMP/host-data-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: host-data-proof-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-data-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain bounded success or failure proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-package-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OWNED_STAGE }}/artifacts/
          if-no-files-found: warn
          retention-days: 14
